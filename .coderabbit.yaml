language: en-US

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: false
  poem: false
  review_status: false
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - ".*"
  path_filters:
    - "!**/vendor/**"
    - "!testdata/**"
    - "!**/dist/**"
    - "!**/*_generated.go"
    - "!**/zz_generated*.go"
    - "!**/bin/**"
    - "!**/reporting/**"
  tools:
    golangci-lint:
      enabled: false
    yamllint:
      enabled: false
    shellcheck:
      enabled: true
  pre_merge_checks:
    docstrings:
      mode: off

knowledge_base:
  opt_out: false
  code_guidelines:
    enabled: true
    # A plain entry governs only its own directory and below. A document that
    # governs code elsewhere needs the object form, with applyTo naming that
    # code. .claude/rules/ is read by default, scoped by each rule's paths:.
    filePatterns:
      # How we write code and ship it
      - files: .claude/CLAUDE.md
        applyTo: "**"
      - CONTRIBUTING.md
      - README.md
      - operator/README.md
      - agent/README.md
      # Domain vocabulary and semantic rules reviewers should enforce
      - files: docs/architecture/operator-status.md
        applyTo: "operator/**"
      - files: docs/operations/resource-management.md
        applyTo: "operator/**, chart/**"
      - files: docs/operations/versioning.md
        applyTo: "**"
      - files: docs/architecture/interrupt-flow.md
        applyTo: "operator/**, agent/**"
      - files: docs/user-guide/runtime-required.md
        applyTo: "operator/**, chart/**"
      - files: docs/architecture/ordering.md
        applyTo: "operator/**"

chat:
  auto_reply: true
