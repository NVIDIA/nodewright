# git-cliff configuration
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
# `commit.message` is only the conventional-commit description when the commit
# parses as one; with filter_unconventional = false everything else keeps its full
# raw message, body included. Hence `split | first`: one changelog bullet is one
# subject line, never a commit body.
#
# The `commit.remote.*` fields are only populated when git-cliff's GitHub
# integration runs, which `--offline` disables. Committed changelogs are rendered
# offline (scripts/gen-changelog.sh) so the attribution clauses collapse to
# nothing there; release notes are rendered online (the release workflows) so
# they carry author credit and a link back to the PR. One template, two
# renderings -- do not "fix" this by hardcoding either half.
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | split(pat="\n") | first | trim | upper_first }}\
            {% if commit.remote.username %} by {% if commit.remote.username is ending_with("[bot]") %}@{{ commit.remote.username }}{% else %}[@{{ commit.remote.username }}](https://github.com/{{ commit.remote.username }}){% endif %}{%- endif %}\
            {% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}](https://github.com/NVIDIA/nodewright/pull/{{ commit.remote.pr_number }}){%- endif %}\
    {% endfor %}
{% endfor %}\n
{% set_global has_human_contributor = false %}\
{% for contributor in github.contributors %}\
    {% if contributor.username and not contributor.username is ending_with("[bot]") %}\
        {% set_global has_human_contributor = true %}\
    {% endif %}\
{% endfor %}\
{% if has_human_contributor %}\
    ### Contributors
    Thanks to everyone whose work landed in this release:
    {% for contributor in github.contributors %}\
        {% if contributor.username and not contributor.username is ending_with("[bot]") %}\
            - [@{{ contributor.username }}](https://github.com/{{ contributor.username }})
        {% endif %}\
    {% endfor %}\
{% endif %}\
"""
footer = """
<!-- Generated by git-cliff -->
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_preprocessors = [
    # Some PRs were squashed with GitHub's merge-style subject, so the real
    # conventional message sits in the body: `Merge pull request #N from ...\n\n
    # chore(chart): bump ...`. Drop the subject line so the body is parsed and
    # grouped normally. On release branches this commit is often the only one the
    # path filter keeps, so without this the whole release section renders empty.
    { pattern = '^Merge pull request #[0-9]+ from \S+[ \t]*\r?\n\s*\r?\n', replace = "" },
    # Strip the trailing `(#472)` GitHub appends to a squash-merge subject. It is
    # bare text, not a link, and it duplicates the linked `in [#472](...)` the
    # template adds from commit.remote.pr_number on online (release-notes) runs.
    { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "" },
]
commit_parsers = [
    # Skip real merge commits by parent count, not by subject: they duplicate the
    # branch commits already listed individually, and branch-sync merges carry
    # git's `# Conflicts:` block plus hand-written merge prose in their body. The
    # subject alone can't decide this, because the squashes handled above look
    # identical and do carry content.
    { field = "merge_commit", pattern = "true", skip = true },
    { message = "^feat", group = "New Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^bug", group = "Bug Fixes" },
    { message = "^docs:", skip = true },
    { message = "^test:", skip = true },
    { message = "^lint:", skip = true },
    { message = "^chore: readme", skip = true },
    { message = "^chore: bump version", skip = true },
    { message = "^chore: update CHANGELOG", skip = true },
    { message = "^build: release v[0-9]+\\.[0-9]+\\.[0-9]+", skip = true },
    { message = ".*", group = "Other Tasks" },
]
protect_breaking_commits = false
filter_commits = false
# Matches component-prefixed tags: operator/v0.14.0, chart/v0.14.0, agent/v6.4.0, cli/v0.1.0
tag_pattern = "(operator|chart|agent|cli)/v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

# Pin the repo git-cliff resolves authors and PR numbers against, rather than
# letting it infer one from the runner's `origin` remote: a fork's checkout, or a
# clone via a different URL spelling, would otherwise silently enrich against the
# wrong repo or not at all. Only consulted on online runs -- `--offline` skips
# the GitHub API entirely, which is what committed changelogs use.
[remote.github]
owner = "NVIDIA"
repo = "nodewright"
