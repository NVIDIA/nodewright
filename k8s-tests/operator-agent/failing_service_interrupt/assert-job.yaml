## The pod watch ended the interrupt Job for its restart budget: backoffLimit dropped to 0, the
## verdict annotation set, and the Job controller failed it as out of retries. JobReconcile then
## recorded the timeout and kept the Job as its marker.
---
apiVersion: batch/v1
kind: Job
metadata:
  namespace: nodewright
  labels:
    nodewright.nvidia.com/name: failing-service-interrupt-agent-operator
    nodewright.nvidia.com/interrupt: "True"
  annotations:
    nodewright.nvidia.com/restart-allowance: "3"
    (contains(keys(@), 'nodewright.nvidia.com/restart-limit-exceeded')): true
    nodewright.nvidia.com/state-recorded: "true"
spec:
  backoffLimit: 0
status:
  (conditions[?type == 'Failed']):
  - reason: BackoffLimitExceeded
    status: "True"
