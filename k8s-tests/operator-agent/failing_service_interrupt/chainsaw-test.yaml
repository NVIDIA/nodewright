# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: failing-service-interrupt-agent-operator
spec:
  timeouts:
    exec: 90s
  catch: ## if errors, print the most important info
  - get:
      apiVersion: batch/v1
      kind: Job
      namespace: nodewright
      selector: nodewright.nvidia.com/name=failing-service-interrupt-agent-operator
      format: yaml
  - get:
      apiVersion: v1
      kind: Pod
      namespace: nodewright
      selector: nodewright.nvidia.com/name=failing-service-interrupt-agent-operator
      format: yaml
  steps:
  - try:
    - script:
        content: |
          ## remove annotation from last run
          ../../../operator/bin/nodewright reset failing-service-interrupt-agent-operator --confirm 2>/dev/null || true
    - script:
        content: |
          ## reinstall the debug pod in case it was deleted
          ../setup.sh kind-worker setup
    - script:
        content: |
          ## clean up agent state from prior runs
          ../check_node.sh kind-worker "rm -rf /var/log/skyhook/failing-service-interrupt-agent-operator || true" ".*" 2
          ../check_node.sh kind-worker "rm -rf /var/lib/skyhook/failing-service-interrupt-agent-operator || true" ".*" 2
    - apply:
        file: nodewright.yaml
    ## The interrupt names a unit that does not exist, so every run fails. jobBackoffLimit is 3,
    ## so the pod watch ends the Job once a fourth run fails, after about 30s of kubelet restart
    ## backoff on top of the stages before it. The Job's 1h deadline is never close.
    - assert:
        timeout: 240s
        file: assert-job.yaml
    - assert:
        timeout: 60s
        file: assert.yaml
  - finally:
    - delete:
        file: nodewright.yaml
