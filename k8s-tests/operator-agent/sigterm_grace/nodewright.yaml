apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  labels:
    app.kubernetes.io/part-of: skyhook-operator
    app.kubernetes.io/created-by: skyhook-operator
  name: sigterm-grace-agent-operator
spec:
  nodeSelectors:
    matchLabels:
      nodewright.nvidia.com/test-node: skyhooke2e
  packages:
    sigterm-grace-agent-operator:
      version: "1.1.1"
      image: ghcr.io/nvidia/skyhook-packages/shellscript
      # Longer than the step below runs. The test deletes the package pod while
      # the step is mid-sleep; this is the window the step must be allowed to
      # finish within. See docs/user-guide/custom-resource.md#gracefulshutdown.
      gracefulShutdown: 2m
      configMap:
        # Progress markers go to the package's state root rather than
        # $SKYHOOK_DIR: the copy dir is per-attempt, and the retry after the
        # pod delete must read what the killed attempt wrote.
        apply.sh: |
          #!/bin/bash
          progress=/var/lib/skyhook/sigterm-grace-agent-operator/progress
          mkdir -p "$(dirname "$progress")"
          echo "start $(date +%s)" >> "$progress"
          sleep 60
          echo "end $(date +%s)" >> "$progress"
        apply_check.sh: |
          #!/bin/bash
          echo "apply checked"
        config.sh: |
          #!/bin/bash
          echo "configuring"
        config_check.sh: |
          #!/bin/bash
          echo "config checked"
