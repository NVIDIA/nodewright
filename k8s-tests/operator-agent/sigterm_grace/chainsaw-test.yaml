# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: sigterm-grace-agent-operator
spec:
  timeouts:
    assert: 240s
    # The step sleeps for 60s and the second poll below waits for it to end, so
    # the suite's usual 90s exec budget leaves no room for a slow scheduler. The
    # retry counts below are sized so a poll that never matches still runs out
    # inside this budget: each check_node.sh iteration is a kubectl exec plus a 1s
    # sleep, and if chainsaw kills the op first the Data:/Check: diagnostic is lost.
    exec: 150s
  steps:
  - try:
    - script:
        content: |
          ## remove annotation from last run
          ../../../operator/bin/nodewright reset sigterm-grace-agent-operator --confirm 2>/dev/null || true
    - script:
        content: |
          ## reinstall the debug pod in case it was deleted
          ../setup.sh kind-worker setup
    - script:
        content: |
          ## clean up from prior runs
          ../check_node.sh kind-worker "rm -rf /var/log/skyhook/sigterm-grace-agent-operator || true" ".*" 2
          ../check_node.sh kind-worker "rm -rf /var/lib/skyhook/sigterm-grace-agent-operator || true" ".*" 2
    - apply:
        file: nodewright.yaml
    - script:
        content: |
          set -e
          ## Wait until apply.sh is genuinely mid-run before pulling the pod. Deleting it
          ## any earlier tests scheduling, not signal handling.
          ../check_node.sh kind-worker "cat /var/lib/skyhook/sigterm-grace-agent-operator/progress" "^start" 60
    - script:
        content: |
          set -e
          ## This is the regression under test (#672). The pod receives SIGTERM while
          ## apply.sh is asleep, with gracefulShutdown well above the remaining sleep.
          ## The agent must let the step finish: the Python agent always did, and the Go
          ## agent used to SIGKILL the step's process group the instant SIGTERM arrived,
          ## which made gracefulShutdown a no-op.
          ##
          ## Delete only a pod whose apply container is running right now, and fail if there
          ## is none. A label-scoped delete with --ignore-not-found would also accept a pod
          ## that had already finished apply, or no pod at all, and the start/end counts
          ## below would then pass without a SIGTERM ever reaching the step. The apply
          ## stage is an init container named <package>-apply (job_builder.go), so its
          ## running state is what identifies the pod.
          pod=$(kubectl -n nodewright get pod \
            -l nodewright.nvidia.com/name=sigterm-grace-agent-operator,nodewright.nvidia.com/stage=apply \
            -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.status.initContainerStatuses[?(@.name=="sigterm-grace-agent-operator-apply")].state.running.startedAt}{"\n"}{end}' \
            | awk 'NF == 2 { print $1; exit }')
          if [ -z "$pod" ]; then
            echo "no pod with a running sigterm-grace-agent-operator-apply container"
            kubectl -n nodewright get pod -l nodewright.nvidia.com/name=sigterm-grace-agent-operator -o wide
            exit 1
          fi
          ## --wait=false because the pod legitimately outlives the delete call for the
          ## rest of the step.
          kubectl -n nodewright delete pod "$pod" --wait=false
    - script:
        content: |
          set -e
          ## The step wrote "start" before the delete; only a step that survived the
          ## SIGTERM writes "end".
          progress=/var/lib/skyhook/sigterm-grace-agent-operator/progress
          ../check_node.sh kind-worker "cat $progress" "^end" 75
    - assert:
        ## Let the package converge before counting attempts. Deleting the pod makes the
        ## Job count that attempt as failed whatever the agent exits with (a pod deleted
        ## mid-init never reaches Succeeded), so a replacement pod runs the apply stage
        ## again, and this package's steps declare idempotence: true (Disabled), which
        ## both agents read as "run regardless of the completion flag". apply.sh therefore
        ## runs twice by design, and a count taken right after the first "end" only ever
        ## saw one pair by racing the replacement pod.
        file: assert.yaml
    - script:
        content: |
          set -e
          ## What gracefulShutdown guarantees is that the attempt that received SIGTERM
          ## finished, so the check is on identity, not counts or timing: the attempt id
          ## on the first "start" must appear on an "end", and every start must have an
          ## end. In the #672 regression the killed attempt's id never gets an end. One
          ## awk does both and prints the counts when it fails, since check_node.sh only
          ## shows what the command printed.
          progress=/var/lib/skyhook/sigterm-grace-agent-operator/progress
          ../check_node.sh kind-worker "awk '\$1 == \"start\" {starts++; if (!first) first = \$2} \$1 == \"end\" {ends++; if (\$2 == first) finished = 1} END {if (finished && starts == ends) print \"first-finished\"; else print \"first=\" (finished ? \"finished\" : \"killed\") \" starts=\" starts \" ends=\" ends}' $progress" "^first-finished$" 2
  - finally:
    - delete:
        file: nodewright.yaml
