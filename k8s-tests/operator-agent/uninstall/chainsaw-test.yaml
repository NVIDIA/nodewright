# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: uninstall-agent-operator
spec:
  timeouts:
    assert: 240s
    exec: 90s
    # This is the only scenario in the suite whose CR has uninstall.enabled, so
    # deleting it goes through the finalizer-driven uninstall flow rather than a
    # plain delete. Chainsaw's 15s default is not enough for that round trip.
    cleanup: 120s
    delete: 120s
  steps:
  - name: install
    try:
    - script:
        content: |
          ## remove annotation from last run
          ../../../operator/bin/nodewright reset uninstall-agent-operator --confirm 2>/dev/null || true
    - script:
        content: |
          ## reinstall the debug pod in case it was deleted
          ../setup.sh kind-worker setup
    - script:
        content: |
          ## clean up from prior runs
          ../check_node.sh kind-worker "rm -rf /var/log/skyhook/uninstall-agent-operator || true" ".*" 2
          ../check_node.sh kind-worker "rm -rf /var/lib/skyhook/uninstall-agent-operator || true" ".*" 2
    - apply:
        file: nodewright.yaml
    - assert:
        file: assert.yaml
    - script:
        content: |
          set -e
          ## Pin that the package really installed before uninstalling it. Without this the
          ## uninstall assertions below would also pass against a package that never ran,
          ## since both amount to "the step flag is absent".
          ../check_node.sh kind-worker "ls /var/lib/skyhook/uninstall-agent-operator/flags/shellscript/1.1.1/" "shellscript_run.sh.*"

  - name: uninstall
    try:
    - update:
        file: update-trigger-uninstall.yaml
    - assert:
        ## This is the wait for the uninstall to finish, and it does more than wait. An emptied
        ## nodeState is the established signal that the operator converged, so an operator
        ## that ran the uninstall and then wedged fails here rather than passing on filesystem
        ## checks alone. It also settles the node before those checks run: without it the
        ## flag-absence and history reads below would race uninstall-check and need a retry
        ## budget that, on the failure path, runs past the 90s exec timeout and kills the op
        ## before check_node.sh prints its Data:/Check: diagnostic. Asserting it before finally
        ## also keeps the finalizer-driven delete-time uninstall off the cleanup critical path.
        resource:
          apiVersion: v1
          kind: Node
          metadata:
            labels:
              nodewright.nvidia.com/test-node: skyhooke2e
            annotations:
              nodewright.nvidia.com/nodeState_uninstall-agent-operator: '{}'
    - script:
        content: |
          ## set -e: chainsaw runs script content as `sh -c`, so without it only the last
          ## command decides the step.
          set -e

          ## The uninstall and uninstall-check stages are the only stages in this suite with no
          ## coverage at all before this test, and they are the ones the cutover cannot walk
          ## back: a package uninstalled by a divergent agent leaves the host in a state no
          ## later stage repairs.
          ##
          ## The inverted grep catches a missing configmap key, which shellscript_run.sh
          ## reports on stdout while still exiting 0. It only sees the logs still on disk:
          ## both agents keep the 5 newest shellscript_run.sh logs, and this package runs six
          ## stages through it, so the apply log has already been rotated away by now and a
          ## missing apply.sh would get past this guard. Every other scenario exercises apply,
          ## so that gap is accepted rather than raced.
          log=/var/log/skyhook/uninstall-agent-operator/shellscript/1.1.1
          ../check_node.sh kind-worker "cat $log/*.log" "uninstall ran" 10
          ../check_node.sh kind-worker "cat $log/*.log" "uninstall checked" 10
          ../check_node.sh kind-worker "cat $log/*.log" "Could not find file" 2 true
    - script:
        content: |
          set -e
          ## After a successful uninstall-check both agents delete every step flag for the
          ## package, so a later reinstall re-runs its steps instead of finding stale flags and
          ## skipping them. Python does this in remove_flags(); Go does it in removeStepFlags().
          ## Asserting absence is what makes a divergence here visible. The positive ls on this
          ## exact path in the install step is what stops this passing vacuously.
          ../check_node.sh kind-worker "ls /var/lib/skyhook/uninstall-agent-operator/flags/shellscript/1.1.1/ 2>/dev/null || true" "shellscript_run.sh" 10 true
    - script:
        content: |
          set -e
          ## The history ledger is the agent's own record of what is installed, and uninstall is
          ## the one transition that writes a sentinel rather than a version. Nothing else in
          ## this suite reads the ledger's contents.
          ##
          ## Matched against the current-version key rather than the bare word, which also
          ## appears in the history[] entry for this transition. The ` *` keeps it agnostic to
          ## separator spacing: Python's json.dump emits `"current-version": "uninstalled"`
          ## and Go's encoding/json emits no space, so an exact match would pass on one agent
          ## and fail on the other.
          ../check_node.sh kind-worker "cat /var/lib/skyhook/uninstall-agent-operator/history/shellscript.json" '"current-version": *"uninstalled"' 10
  - finally:
    - delete:
        file: update-trigger-uninstall.yaml
