# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: preflight-package-artifacts
spec:
  description: >
    With PACKAGE_ARTIFACTS on, every package's install on a node starts with a preflight stage,
    whose agent inspects the package reference with the node's credentials and reports through its
    termination message. The registry here requires a credential that only the package
    ServiceAccount carries, as #871 asks: an artifact package must install with it alone, uninstall
    as it was installed, a rejected artifact must hold its package, and an unauthorized preflight
    must fall back to a container-image Job.
  timeouts:
    apply: 30s
    assert: 300s
    exec: 300s
    cleanup: 180s
    delete: 180s
  catch:
  - script:
      content: |
        kubectl get nodewrights preflight-artifacts preflight-rejected preflight-unauthorized -o yaml 2>/dev/null || true
        kubectl get jobs,pods -n nodewright -o wide || true
        kubectl get pods -n nodewright -l nodewright.nvidia.com/stage=preflight \
          -o jsonpath='{range .items[*]}{.metadata.name}{": "}{.status.initContainerStatuses[0].state.terminated.message}{"\n"}{end}' || true
        kubectl logs -n nodewright e2e-registry-pusher || true
        kubectl get events -A --field-selector=reason=Preflight || true
  steps:
  - name: registry
    try:
    - script:
        content: |
          ## remove annotations from a last run, which a deletion keeps for the package whose
          ## artifact declares uninstall unsupported
          for name in preflight-artifacts preflight-rejected preflight-unauthorized; do
            ../../../operator/bin/nodewright reset "$name" --confirm 2>/dev/null || true
          done
    - script:
        content: |
          ## the debug pod, which registry-certs.sh and check_node.sh reach the node through
          ../../operator-agent/setup.sh kind-worker setup
    - script:
        content: ./registry-certs.sh kind-worker
    - script:
        content: |
          kubectl create secret docker-registry e2e-registry-pull -n nodewright \
            --docker-server=localhost:5443 --docker-username=placeholder-user --docker-password=placeholder-password \
            --dry-run=client -o yaml | kubectl apply -f -
    - apply:
        file: serviceaccount.yaml
    - apply:
        file: registry.yaml
    - apply:
        file: pusher.yaml
    - script:
        content: |
          ## A script rather than an assert, so a failed push ends the step at once.
          for i in $(seq 1 120); do
            phase=$(kubectl get pod -n nodewright e2e-registry-pusher -o jsonpath='{.status.phase}')
            case "$phase" in
              Succeeded) exit 0 ;;
              Failed) kubectl logs -n nodewright e2e-registry-pusher; exit 1 ;;
            esac
            sleep 2
          done
          echo "pusher still $phase"
          exit 1
    cleanup:
    - script:
        content: |
          for name in preflight-artifacts preflight-rejected preflight-unauthorized; do
            ../../../operator/bin/nodewright reset "$name" --confirm 2>/dev/null || true
          done
          kubectl delete secret -n nodewright e2e-registry-pull e2e-registry-tls --ignore-not-found
          kubectl delete configmap -n nodewright e2e-registry-ca --ignore-not-found
          kubectl exec kind-worker-debugger -- rm -rf /host/etc/nodewright-e2e || true

  - name: install
    try:
    - apply:
        file: artifacts.yaml
    - assert:
        file: assert-artifacts.yaml
    - script:
        content: |
          set -e
          ns=nodewright
          pushed=$(kubectl logs -n $ns e2e-registry-pusher)
          state=$(kubectl get nodewright preflight-artifacts -o json)
          select="nodewright.nvidia.com/name=preflight-artifacts"
          for pkg in supported unsupported; do
            want="localhost:5443/e2e/${pkg}@$(printf '%s\n' "$pushed" | sed -n "s/^${pkg}=//p")"

            ## Preflight resolved the tag to what was pushed.
            pinned=$(printf '%s' "$state" | jq -r --arg k "${pkg}|1.0.0" '.status.nodeState["kind-worker"][$k].preflight.pinned')
            if [ "$pinned" != "$want" ]; then echo "$pkg: preflight recorded $pinned, pushed $want"; exit 1; fi

            ## Its result came through the termination message, and the registry accepted the
            ## package ServiceAccount's pull secret, the first auth file: no other source holds one.
            message=$(kubectl get pods -n $ns -l "$select,nodewright.nvidia.com/package=${pkg}-1.0.0,nodewright.nvidia.com/stage=preflight" \
              -o jsonpath='{.items[0].status.initContainerStatuses[0].state.terminated.message}')
            credential=$(printf '%s' "$message" | jq -r '.credential')
            if [ "$credential" != "/var/run/secrets/nodewright/registry-auth/0/.dockerconfigjson" ]; then
              echo "$pkg: preflight authenticated with [$credential]: $message"; exit 1
            fi

            ## The apply Job is the artifact Job: no package-image copy container, pinned to that digest,
            ## running as the package ServiceAccount.
            job=$(kubectl get jobs -n $ns -l "$select,nodewright.nvidia.com/package=${pkg}-1.0.0,nodewright.nvidia.com/stage=apply" -o json)
            if printf '%s' "$job" | jq -e --arg c "${pkg}-init" '.items[0].spec.template.spec.initContainers[] | select(.name == $c)' >/dev/null; then
              echo "$pkg: apply Job copies a package image"; exit 1
            fi
            ref=$(printf '%s' "$job" | jq -r '[.items[0].spec.template.spec.initContainers[0].env[] | select(.name == "NODEWRIGHT_PACKAGE_REF")] | last | .value')
            if [ "$ref" != "$want" ]; then echo "$pkg: apply Job pinned to $ref, want $want"; exit 1; fi
            account=$(printf '%s' "$job" | jq -r '.items[0].spec.template.spec.serviceAccountName')
            if [ "$account" != "package-artifacts-e2e" ]; then echo "$pkg: apply Job runs as $account"; exit 1; fi
          done

          ## The container-image package keeps its copy container.
          kubectl get jobs -n $ns -l "$select,nodewright.nvidia.com/package=container-image-1.1.1,nodewright.nvidia.com/stage=apply" \
            -o jsonpath='{.items[0].spec.template.spec.initContainers[*].name}' | grep -qw container-image-init
    - script:
        content: |
          set -e
          ## The artifact's own step ran on the host.
          ../../operator-agent/check_node.sh kind-worker "ls /var/lib/skyhook/preflight-artifacts/flags/e2e-supported/1.0.0/" "step.sh"

  - name: uninstall
    try:
    - patch:
        file: uninstall.yaml
    - script:
        content: |
          ## The supported artifact uninstalls and leaves node state; the unsupported one is held
          ## back on the node that installed it, which UninstallUnsupported reports.
          for i in $(seq 1 120); do
            state=$(kubectl get nodewright preflight-artifacts -o json)
            supported=$(printf '%s' "$state" | jq -r '.status.nodeState["kind-worker"]["supported|1.0.0"].stage // "absent"')
            unsupported=$(printf '%s' "$state" | jq -r '.status.nodeState["kind-worker"]["unsupported|1.0.0"].stage // "absent"')
            condition=$(printf '%s' "$state" | jq -r '.status.conditions[]? | select(.type == "UninstallUnsupported") | .status')
            if [ "$supported" = absent ] && [ "$unsupported" = config ] && [ "$condition" = True ]; then
              exit 0
            fi
            sleep 2
          done
          echo "supported: $supported, unsupported: $unsupported, UninstallUnsupported: $condition"
          exit 1
    - script:
        content: |
          set -e
          ## The uninstall ran the digest preflight recorded at install, with no new preflight.
          want="localhost:5443/e2e/supported@$(kubectl logs -n nodewright e2e-registry-pusher | sed -n 's/^supported=//p')"
          select="nodewright.nvidia.com/name=preflight-artifacts,nodewright.nvidia.com/package=supported-1.0.0"
          ref=$(kubectl get jobs -n nodewright -l "$select,nodewright.nvidia.com/stage=uninstall" -o json \
            | jq -r '[.items[0].spec.template.spec.initContainers[0].env[] | select(.name == "NODEWRIGHT_PACKAGE_REF")] | last | .value')
          if [ "$ref" != "$want" ]; then echo "uninstall Job pinned to $ref, want $want"; exit 1; fi
          count=$(kubectl get jobs -n nodewright -l "nodewright.nvidia.com/name=preflight-artifacts,nodewright.nvidia.com/package=unsupported-1.0.0,nodewright.nvidia.com/stage=uninstall" -o name | wc -l | tr -d ' ')
          if [ "$count" != 0 ]; then echo "the unsupported artifact got an uninstall Job"; exit 1; fi
    - delete:
        ## The deletion does not wait on the held-back package.
        ref:
          apiVersion: nodewright.nvidia.com/v1alpha1
          kind: NodeWright
          name: preflight-artifacts

  - name: rejected
    try:
    - apply:
        file: rejected.yaml
    - assert:
        file: assert-rejected.yaml
    - script:
        content: |
          ## The rejecting Job holds the stage until its 5 minute TTL, and nothing else runs.
          select="nodewright.nvidia.com/name=preflight-rejected,nodewright.nvidia.com/package=rejected-1.0.0"
          for i in $(seq 1 30); do
            ttl=$(kubectl get jobs -n nodewright -l "$select,nodewright.nvidia.com/stage=preflight" -o jsonpath='{.items[0].spec.ttlSecondsAfterFinished}')
            [ "$ttl" = 300 ] && break
            sleep 1
          done
          if [ "$ttl" != 300 ]; then echo "rejecting preflight Job has TTL [$ttl]"; exit 1; fi
          others=$(kubectl get jobs -n nodewright -l "$select" -o jsonpath='{.items[*].metadata.labels.nodewright\.nvidia\.com/stage}')
          if [ "$others" != preflight ]; then echo "Jobs for the rejected package: $others"; exit 1; fi
    - delete:
        ref:
          apiVersion: nodewright.nvidia.com/v1alpha1
          kind: NodeWright
          name: preflight-rejected

  - name: unauthorized
    try:
    - script:
        content: |
          kubectl patch serviceaccount package-artifacts-e2e -n nodewright --type=json \
            -p='[{"op":"remove","path":"/imagePullSecrets"}]'
    - apply:
        file: unauthorized.yaml
    - assert:
        file: assert-unauthorized.yaml
    - script:
        content: |
          ## The node's Preflight Warning names the failure.
          for i in $(seq 1 30); do
            if kubectl get events -A --field-selector=type=Warning,reason=Preflight,involvedObject.name=kind-worker -o json \
              | jq -e '.items[] | select((.message | contains("noauth:1.0.0")) and (.message | contains("unauthorized")))' >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          kubectl get events -A --field-selector=reason=Preflight
          exit 1
    - delete:
        ref:
          apiVersion: nodewright.nvidia.com/v1alpha1
          kind: NodeWright
          name: preflight-unauthorized
