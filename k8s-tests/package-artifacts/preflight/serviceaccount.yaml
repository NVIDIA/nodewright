## The ServiceAccount package pods run as in this suite: make package-artifacts-tests starts the
## operator with PACKAGE_SERVICE_ACCOUNT naming it. Its imagePullSecrets entry is the only
## credential for e2e-registry anywhere in the cluster.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: package-artifacts-e2e
  namespace: nodewright
automountServiceAccountToken: false
imagePullSecrets:
- name: e2e-registry-pull
