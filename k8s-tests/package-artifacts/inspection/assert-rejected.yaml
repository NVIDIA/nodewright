## The rejected artifact blocks its package: no Job, the node reports blocked, and Blocked names
## the package with the reason.
apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: inspection-rejected
status:
  status: blocked
  nodeStatus:
    kind-worker: blocked
  (conditions[?type == 'Blocked']):
  - status: "True"
    reason: PackageArtifactUnusable
    message: "1 package blocked: rejected:1.0.0 (interrupt). A package artifact in a private registry needs its pull Secret in imagePullSecrets."
