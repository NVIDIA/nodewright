# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: cli-reset
spec:
  timeouts:
    assert: 120s
    exec: 90s
  steps:
  # Step 0: Reset state from previous runs
  - name: reset-state
    try:
    - script:
        timeout: 30s
        content: |
          ../nodewright-cli reset cli-reset-test --confirm 2>/dev/null || true
          echo "✓ State reset complete"
  
  # Step 1: Create a Skyhook and wait for it to complete
  - name: setup-skyhook
    try:
    - apply:
        file: nodewright.yaml
    - assert:
        file: assert-nodewright-complete.yaml

  # Step 2: Disable the skyhook so it doesn't restart processing after reset
  - name: disable-skyhook
    try:
    - script:
        timeout: 30s
        content: |
          ../nodewright-cli disable cli-reset-test --confirm
    - assert:
        file: assert-nodewright-disabled.yaml

  # Step 3: Record config changes the way an earlier ConfigMap edit would have, so reset has
  # something to clear (they are per package and survive a node-state reset)
  - name: seed-config-updates
    try:
    - script:
        timeout: 30s
        content: |
          kubectl patch nodewright cli-reset-test --subresource=status --type=merge \
            -p '{"status":{"configUpdates":{"cli-reset-pkg":["game.properties"]}}}'
          test -n "$(kubectl get nodewright cli-reset-test -o jsonpath='{.status.configUpdates}')"

  # Step 4: Test reset command
  - name: test-reset
    try:
    - script:
        timeout: 30s
        content: |
          ../nodewright-cli reset cli-reset-test --confirm
    - assert:
        file: assert-nodes-reset.yaml

  # Step 5: Reset clears the recorded config changes, or the restarted run would skip a package's
  # own interrupt
  - name: config-updates-cleared
    try:
    - script:
        timeout: 30s
        content: |
          out="$(kubectl get nodewright cli-reset-test -o jsonpath='{.status.configUpdates}')"
          test -z "$out" || { echo "configUpdates not cleared: $out"; exit 1; }
