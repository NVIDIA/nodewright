# The policy is the gate under test, so the test user may write NodeWright CRs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: package-policy-test-writer
rules:
- apiGroups: [nodewright.nvidia.com]
  resources: [nodewrights]
  verbs: [get, list, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: package-policy-test-writer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: package-policy-test-writer
subjects:
- apiGroup: rbac.authorization.k8s.io
  kind: User
  name: policy-test-user
