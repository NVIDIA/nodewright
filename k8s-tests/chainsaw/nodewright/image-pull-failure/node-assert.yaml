apiVersion: v1
kind: Node
metadata:
  labels:
    nodewright.nvidia.com/test-node: skyhooke2e
  annotations:
    ## the pull is still being retried, so the package is not failed: its state and the node's status
    ## carry on as in_progress, which other code would read as a failed stage if it said erroring
    ("nodewright.nvidia.com/nodeState_image-pull-failure" && json_parse("nodewright.nvidia.com/nodeState_image-pull-failure")):
      {
        "unpullable|1.0.0": {
            "name": "unpullable",
            "version": "1.0.0",
            "stage": "apply",
            "state": "in_progress"
        }
    }
    nodewright.nvidia.com/status_image-pull-failure: in_progress
