# Completed package Jobs receive the success retention TTL from JobReconcile. The Job names are
# deliberately matched by labels because the builder includes a content hash in each name.
---
kind: Job
apiVersion: batch/v1
metadata:
  namespace: nodewright
  labels:
    nodewright.nvidia.com/name: simple-skyhook
    nodewright.nvidia.com/package: spencer-3.2.3
    nodewright.nvidia.com/stage: apply
spec:
  ttlSecondsAfterFinished: 3600
---
kind: Job
apiVersion: batch/v1
metadata:
  namespace: nodewright
  labels:
    nodewright.nvidia.com/name: simple-skyhook
    nodewright.nvidia.com/package: foobar-1.2
    nodewright.nvidia.com/stage: apply
spec:
  ttlSecondsAfterFinished: 3600
