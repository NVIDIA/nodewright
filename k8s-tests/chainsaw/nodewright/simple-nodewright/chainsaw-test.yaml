# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: simple-skyhook
  labels:
    pool: core
spec:
  timeouts:
    assert: 240s
    exec: 120s ## metrics_test.py waits internally up to TIMEOUT per check
    cleanup: 120s ## finalizer needs time to uncordon, remove labels/annotations, and GC pods
  catch: ## if errors, print the most important info
    - get:
        apiVersion: v1
        kind: Node
        selector: nodewright.nvidia.com/test-node=skyhooke2e
        format: yaml
    - get:
        apiVersion: nodewright.nvidia.com/v1alpha1
        kind: NodeWright
        name: simple-skyhook
        format: yaml
    - get:
        apiVersion: v1
        kind: Pod
        namespace: nodewright
        selector: nodewright.nvidia.com/name=simple-skyhook
        format: yaml
  steps:
  - name: deploy
    description: Reset state, apply a skyhook with three packages, and verify all complete with correct metrics
    try:
    - script:
        content: |
          ## remove annotation from last run
          ../nodewright-cli reset simple-skyhook --confirm 2>/dev/null || true
    - apply: ## set a limit range in the namespace
        file: limitrange.yaml
    - apply:
        file: nodewright.yaml
    - script:
        skipLogOutput: true
        content: |
          set -e
          ## package stage transitions gate on pod and container startup, which can
          ## stall well past the 30s default on a loaded runner
          export TIMEOUT=90
          ../../metrics_test.py nodewright_node_target_count 1 -t nodewright_name=simple-skyhook
        outputs:
        - name: metricsToken
          value: ($stderr)
    - script:
        env:
        - name: METRICS_TOKEN
          value: ($metricsToken)
        content: |
          set -e
          ../../metrics_test.py nodewright_package_state_count 1 -t package_name=dexter -t nodewright_name=simple-skyhook -t state=in_progress
          ../../metrics_test.py nodewright_package_stage_count 1 -t package_name=dexter -t nodewright_name=simple-skyhook -t stage=config
    ## Deprecation-window coverage: the legacy skyhook_* series must carry the same
    ## values under the legacy skyhook_name label until it is dropped in v0.20.0.
    ## Every other metrics assertion in the suite uses the nodewright_* names, so
    ## this is the only place the legacy half is exercised end to end.
    - script:
        env:
        - name: METRICS_TOKEN
          value: ($metricsToken)
        content: |
          set -e
          ../../metrics_test.py skyhook_node_target_count 1 -t skyhook_name=simple-skyhook
          ../../metrics_test.py skyhook_package_state_count 1 -t package_name=dexter -t skyhook_name=simple-skyhook -t state=in_progress
          ../../metrics_test.py skyhook_package_stage_count 1 -t package_name=dexter -t skyhook_name=simple-skyhook -t stage=config
    - assert:
        file: assert_pods.yaml
    - assert:
        file: assert_jobs.yaml
    - script:
        env:
        - name: METRICS_TOKEN
          value: ($metricsToken)
        content: |
          set -e
          ## package stage transitions gate on pod and container startup, which can
          ## stall well past the 30s default on a loaded runner
          export TIMEOUT=90
          ../../metrics_test.py nodewright_package_state_count 1 -t package_name=dexter -t nodewright_name=simple-skyhook -t state=complete
          ../../metrics_test.py nodewright_package_state_count 1 -t package_name=spencer -t nodewright_name=simple-skyhook -t state=in_progress
          ../../metrics_test.py nodewright_package_state_count 1 -t package_name=foobar -t nodewright_name=simple-skyhook -t state=in_progress
          ../../metrics_test.py nodewright_package_stage_count 1 -t package_name=dexter -t nodewright_name=simple-skyhook -t stage=config
          ../../metrics_test.py nodewright_package_stage_count 1 -t package_name=spencer -t nodewright_name=simple-skyhook -t stage=config
          ../../metrics_test.py nodewright_package_stage_count 1 -t package_name=foobar -t nodewright_name=simple-skyhook -t stage=config
    - assert:
        file: assert.yaml
    - assert:
        file: assert_jobs_completed.yaml
    - script:
        content: |
          kubectl wait --for=condition=Ready nodewright/simple-skyhook --timeout=30s
    - script:
        env:
        - name: METRICS_TOKEN
          value: ($metricsToken)
        content: |
          set -e
          ../../metrics_test.py nodewright_node_status_count 1 -t nodewright_name=simple-skyhook -t status=complete
          ../../metrics_test.py nodewright_package_state_count 1 -t package_name=spencer -t nodewright_name=simple-skyhook -t state=complete
          ../../metrics_test.py nodewright_package_state_count 1 -t package_name=foobar -t nodewright_name=simple-skyhook -t state=complete
          ../../metrics_test.py nodewright_package_stage_count 1 -t package_name=spencer -t nodewright_name=simple-skyhook -t stage=config
          ../../metrics_test.py nodewright_package_stage_count 1 -t package_name=foobar -t nodewright_name=simple-skyhook -t stage=config
          # Rollout metrics checks
          ../../metrics_test.py nodewright_rollout_matched_nodes 1 -t nodewright_name=simple-skyhook -t policy_name=legacy -t compartment_name=__default__ -t strategy=fixed
          ../../metrics_test.py nodewright_rollout_ceiling 1 -t nodewright_name=simple-skyhook -t policy_name=legacy -t compartment_name=__default__ -t strategy=fixed
          ../../metrics_test.py nodewright_rollout_completed 1 -t nodewright_name=simple-skyhook -t policy_name=legacy -t compartment_name=__default__ -t strategy=fixed
          ../../metrics_test.py nodewright_rollout_in_progress 0 -t nodewright_name=simple-skyhook -t policy_name=legacy -t compartment_name=__default__ -t strategy=fixed
          ../../metrics_test.py nodewright_rollout_progress_percent 100 -t nodewright_name=simple-skyhook -t policy_name=legacy -t compartment_name=__default__ -t strategy=fixed
  - finally:
    - delete:
        file: limitrange.yaml
