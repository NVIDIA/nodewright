# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: shared-cordon-ownership
  labels:
    pool: interrupt
spec:
  timeouts:
    assert: 180s
  catch:
  - get:
      apiVersion: v1
      kind: Node
      selector: nodewright.nvidia.com/shared-cordon-ownership=true
      format: yaml
  - get:
      apiVersion: nodewright.nvidia.com/v1alpha1
      kind: NodeWright
      name: shared-cordon-fast
      format: yaml
  - get:
      apiVersion: nodewright.nvidia.com/v1alpha1
      kind: NodeWright
      name: shared-cordon-slow
      format: yaml
  steps:
  - name: shared-cordon-ownership
    try:
    - script:
        timeout: 30s
        content: |
          set -eu

          ../nodewright-cli reset shared-cordon-fast --confirm 2>/dev/null || true
          ../nodewright-cli reset shared-cordon-slow --confirm 2>/dev/null || true

          node=$(kubectl get nodes -l nodewright.nvidia.com/test-node=skyhooke2e -o jsonpath='{.items[0].metadata.name}')
          if [ -z "$node" ]; then
            echo "no skyhooke2e test node found"
            exit 1
          fi

          kubectl label node "$node" nodewright.nvidia.com/shared-cordon-ownership=true --overwrite
    - create:
        file: blocker-pod.yaml
    - wait:
        apiVersion: v1
        kind: Pod
        name: shared-cordon-blocker
        timeout: 30s
        for:
          condition:
            name: Ready
            value: 'true'
    - create:
        file: nodewright-slow.yaml
    - script:
        timeout: 90s
        content: |
          set -eu

          node=$(kubectl get nodes -l nodewright.nvidia.com/shared-cordon-ownership=true -o jsonpath='{.items[0].metadata.name}')
          for _ in $(seq 1 90); do
            slow_cordon=$(kubectl get node "$node" -o jsonpath='{.metadata.annotations.nodewright\.nvidia\.com/cordon_shared-cordon-slow}' 2>/dev/null || true)
            unschedulable=$(kubectl get node "$node" -o jsonpath='{.spec.unschedulable}' 2>/dev/null || true)

            if [ "$slow_cordon" = "true" ] && [ "$unschedulable" = "true" ]; then
              exit 0
            fi

            sleep 1
          done

          kubectl get node "$node" -o yaml
          kubectl get nodewright shared-cordon-slow -o yaml
          echo "timed out waiting for shared-cordon-slow to own the cordon"
          exit 1
    - create:
        file: nodewright-fast.yaml
    - assert:
        timeout: 120s
        resource:
          apiVersion: nodewright.nvidia.com/v1alpha1
          kind: NodeWright
          metadata:
            name: shared-cordon-fast
          status:
            status: complete
    - script:
        timeout: 30s
        content: |
          set -eu

          node=$(kubectl get nodes -l nodewright.nvidia.com/shared-cordon-ownership=true -o jsonpath='{.items[0].metadata.name}')
          unschedulable=$(kubectl get node "$node" -o jsonpath='{.spec.unschedulable}' 2>/dev/null || true)
          fast_cordon=$(kubectl get node "$node" -o jsonpath='{.metadata.annotations.nodewright\.nvidia\.com/cordon_shared-cordon-fast}' 2>/dev/null || true)
          slow_cordon=$(kubectl get node "$node" -o jsonpath='{.metadata.annotations.nodewright\.nvidia\.com/cordon_shared-cordon-slow}' 2>/dev/null || true)

          if [ "$unschedulable" != "true" ]; then
            kubectl get node "$node" -o yaml
            echo "expected node to stay unschedulable while shared-cordon-slow still owns a cordon"
            exit 1
          fi

          if [ -n "$fast_cordon" ]; then
            kubectl get node "$node" -o yaml
            echo "expected shared-cordon-fast cordon annotation to be removed after completion"
            exit 1
          fi

          if [ "$slow_cordon" != "true" ]; then
            kubectl get node "$node" -o yaml
            echo "expected shared-cordon-slow cordon annotation to keep the node cordoned"
            exit 1
          fi
    - delete:
        file: blocker-pod.yaml
    - assert:
        timeout: 180s
        resource:
          apiVersion: nodewright.nvidia.com/v1alpha1
          kind: NodeWright
          metadata:
            name: shared-cordon-slow
          status:
            status: complete
    - script:
        timeout: 30s
        content: |
          set -eu

          node=$(kubectl get nodes -l nodewright.nvidia.com/shared-cordon-ownership=true -o jsonpath='{.items[0].metadata.name}')
          unschedulable=$(kubectl get node "$node" -o jsonpath='{.spec.unschedulable}' 2>/dev/null || true)
          cordons=$(kubectl get node "$node" -o json | jq -r '.metadata.annotations // {} | keys[] | select(startswith("nodewright.nvidia.com/cordon_"))')

          if [ -n "$unschedulable" ] && [ "$unschedulable" != "false" ]; then
            kubectl get node "$node" -o yaml
            echo "expected node to become schedulable after both Skyhooks complete"
            exit 1
          fi

          if [ -n "$cordons" ]; then
            kubectl get node "$node" -o yaml
            echo "expected no Skyhook cordon annotations after both Skyhooks complete"
            exit 1
          fi
    finally:
    - script:
        timeout: 30s
        content: |
          set -eu

          kubectl delete pod shared-cordon-blocker --ignore-not-found=true --wait=false 2>/dev/null || true
          ../nodewright-cli reset shared-cordon-fast --confirm 2>/dev/null || true
          ../nodewright-cli reset shared-cordon-slow --confirm 2>/dev/null || true

          node=$(kubectl get nodes -l nodewright.nvidia.com/shared-cordon-ownership=true -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)
          if [ -n "$node" ]; then
            kubectl uncordon "$node" 2>/dev/null || true
            kubectl label node "$node" nodewright.nvidia.com/shared-cordon-ownership- 2>/dev/null || true
          fi
