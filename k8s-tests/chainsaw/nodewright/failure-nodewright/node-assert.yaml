apiVersion: v1
kind: Node
metadata:
  labels:
    nodewright.nvidia.com/test-node: skyhooke2e
  annotations:
    ## the leading test is because it vomits on nil ie empty key, so it must exist and pass the test
    ("nodewright.nvidia.com/nodeState_failure-skyhook" && json_parse("nodewright.nvidia.com/nodeState_failure-skyhook")): 
      {
        "dexter|1.2.3": {
            "name": "dexter",
            "version": "1.2.3",
            "image": "ghcr.io/nvidia/skyhook/agentless",
            "stage": "config",
            "state": "complete"
        },
        "failure|1.2.3": {
            "name": "failure",
            "version": "1.2.3",
            "image": "ghcr.io/nvidia/skyhook/agentless",
            "stage": "apply",
            "state": "erroring"
        }
    }
    ## Assert the terminal package state directly, rather than relying on pod restart counts.
    (json_parse("nodewright.nvidia.com/nodeState_failure-skyhook")."failure|1.2.3".state): erroring
    nodewright.nvidia.com/status_failure-skyhook: erroring
status:
  (conditions[?type == 'nodewright.nvidia.com/failure-skyhook/NotReady']):
  - reason: "Incomplete"
    status: "True"
  (conditions[?type == 'nodewright.nvidia.com/failure-skyhook/Erroring']):
  - reason: "Package(s) Erroring or Unknown"
    status: "True"
---
apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: failure-skyhook
status:
  status: erroring
  completeNodes: 0/1
  packageList: "dexter:1.2.3,failure:1.2.3"
  nodesInProgress: 1
