# node-assert.yaml pins the erroring state the node reaches once the retry budget runs out.
# This pins the Job itself: it goes terminal, and the operator leaves it in place as the timeout
# marker rather than letting the stage churn forever.
---
kind: Job
apiVersion: batch/v1
metadata:
  namespace: nodewright
  labels:
    nodewright.nvidia.com/name: failure-skyhook
    nodewright.nvidia.com/package: failure-1.2.3
    nodewright.nvidia.com/stage: apply
  annotations:
    ## JobReconcile recorded the erroring state before marking, so the timeout is real
    nodewright.nvidia.com/state-recorded: "true"
spec:
  backoffLimit: 3
  ## the failure TTL (JOB_TTL_FAILED 24h), set at completion so failure logs outlive success logs
  ttlSecondsAfterFinished: 86400
status:
  ## every attempt ran the step and exited nonzero, so all of them count
  failed: 4
  (conditions[?type == 'Failed']):
  - reason: BackoffLimitExceeded
    status: "True"
