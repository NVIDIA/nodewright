---
kind: Pod
apiVersion: v1
metadata:
  namespace: nodewright
  labels:
    nodewright.nvidia.com/name: cleanup-pods
    nodewright.nvidia.com/package: bb-1.2
  annotations:
    ("nodewright.nvidia.com/package" && parse_json("nodewright.nvidia.com/package")):
      {
        "name": "bb",
        "version": "1.2",
        "skyhook": "cleanup-pods",
        "stage": "config",
        "image": "ghcr.io/nvidia/skyhook/agentless"
      }
  ownerReferences:
    ## controller: true proves the pod is the Job's child, not merely referencing one. The Job's
    ## own name is deliberately not asserted: it carries a config hash, so pinning it here would
    ## break every test on any change to the naming scheme. assert_jobs.yaml covers Job ownership.
    - apiVersion: batch/v1
      kind: Job
      controller: true
spec:
  terminationGracePeriodSeconds: 46
  initContainers:
    - name: bb-init
    - name: bb-config
      args:
        ([0]): config
        ([1]): /root
        (length(@)): 3
    - name: bb-configcheck
      args:
        ([0]): config-check
        ([1]): /root
        (length(@)): 3
---
apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: cleanup-pods
status:
  status: complete
  observedGeneration: 2
  nodeState:
    (values(@)):
    - aa|1.2.3:
        image: ghcr.io/nvidia/skyhook/agentless
        name: aa
        stage: config
        state: complete
        version: 1.2.3
    - bb|1.2:
        image: ghcr.io/nvidia/skyhook/agentless
        name: bb
        stage: config
        state: complete
        version: "1.2"
  nodeStatus:
   # grab values should be one and is complete
    (values(@)):
      - complete
      - complete
