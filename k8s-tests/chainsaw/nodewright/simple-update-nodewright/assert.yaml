apiVersion: v1
kind: Node
metadata:
  labels:
    nodewright.nvidia.com/test-node: skyhooke2e
    nodewright.nvidia.com/status_simple-update-skyhook: complete
  annotations:
    (length("nodewright.nvidia.com/version_simple-update-skyhook") >= `6`): true
    ("nodewright.nvidia.com/nodeState_simple-update-skyhook" && parse_json("nodewright.nvidia.com/nodeState_simple-update-skyhook")):
      {
        "dexter|1.2.3": {
            "name": "dexter",
            "version": "1.2.3",
            "image": "ghcr.io/nvidia/skyhook/agentless",
            "stage": "config",
            "state": "complete"
        },
        "foobar|1.2": {
            "name": "foobar",
            "version": "1.2",
            "image": "ghcr.io/nvidia/skyhook/agentless",
            "stage": "config",
            "state": "complete"
        },
        "spencer|3.2.3": {
            "name": "spencer",
            "version": "3.2.3",
            "image": "ghcr.io/nvidia/skyhook/agentless",
            "stage": "config",
            "state": "complete"
        }
      }
    nodewright.nvidia.com/status_simple-update-skyhook: complete
status:
  (conditions[?type == 'nodewright.nvidia.com/simple-update-skyhook/NotReady']):
  - reason: "Complete"
    status: "False"
  (conditions[?type == 'nodewright.nvidia.com/simple-update-skyhook/Erroring']):
  - reason: "Not Erroring"
    status: "False"
---
apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: simple-update-skyhook
  annotations:
    ## test that version info is present
    ## the quotes are to escape the . and / in the key
    (length("nodewright.nvidia.com/version") >= `6`): true
status:
  status: complete
  observedGeneration: 1
  nodeState:
    (values(@)):
      - dexter|1.2.3:
          name: dexter
          state: complete
          version: '1.2.3'
          image: ghcr.io/nvidia/skyhook/agentless
          stage: config
        foobar|1.2:
          name: foobar
          state: complete
          version: '1.2'
          image: ghcr.io/nvidia/skyhook/agentless
          stage: config
        spencer|3.2.3:
          name: spencer
          state: complete
          version: '3.2.3'
          image: ghcr.io/nvidia/skyhook/agentless
          stage: config
  nodeStatus:
   # grab values should be one and is complete
    (values(@)):
      - complete
---
kind: ConfigMap
apiVersion: v1
metadata:
  name: simple-update-skyhook-dexter-1.2.3
  namespace: nodewright
  labels:
    nodewright.nvidia.com/name: simple-update-skyhook
  ownerReferences:
  - apiVersion: nodewright.nvidia.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: NodeWright
    name: simple-update-skyhook
data:
  game.properties: |
    enemies=aliens
    lives=3
    enemies.cheat=true
    enemies.cheat.level=noGoodRotten
  ui.properties: |
    color.good=purple
    color.bad=yellow
    allow.textmode=true
    how.nice.to.look=fairlyNice
---
kind: ConfigMap
apiVersion: v1
metadata:
  namespace: nodewright
  labels:
    nodewright.nvidia.com/skyhook-node-meta: simple-update-skyhook
  ownerReferences:
  - apiVersion: nodewright.nvidia.com/v1alpha1
    blockOwnerDeletion: true
    controller: true
    kind: NodeWright
    name: simple-update-skyhook
data:
  (length(@)): 3
  labels.json:
    (contains(@, 'nodewright.nvidia.com/test-node')): true
    (contains(@, 'nodewright.nvidia.com/status_simple-update-skyhook')): true
  annotations.json:
    (contains(@, 'nodewright.nvidia.com/status_simple-update-skyhook')): true
    (contains(@, 'nodewright.nvidia.com/nodeState_simple-update-skyhook')): true
  packages.json:
    (contains(@, '"agentVersion"')): true
    (contains(@, '"dexter"')): true
    (contains(@, '"1.2.3"')): true
