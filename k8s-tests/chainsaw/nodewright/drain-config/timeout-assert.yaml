apiVersion: v1
kind: Node
metadata:
  labels:
    nodewright.nvidia.com/test-node: skyhooke2e
    nodewright.nvidia.com/status_drain-config-timeout: erroring
  annotations:
    nodewright.nvidia.com/status_drain-config-timeout: erroring
    (contains(keys(@), 'nodewright.nvidia.com/drainStart_drain-config-timeout')): true
    ## Other pods may share the node and hold the drain too, so the blocker list is filtered
    ## rather than matched whole, and the DrainBlocked reason below is left unpinned.
    ("nodewright.nvidia.com/drainBlocked_drain-config-timeout" && length(parse_json("nodewright.nvidia.com/drainBlocked_drain-config-timeout")[?namespace == 'nodewright' && name == 'drain-config-blocker']) > `0`): true
spec:
  taints:
  - effect: NoSchedule
    key: node.kubernetes.io/unschedulable
---
apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: drain-config-timeout
status:
  status: erroring
  nodeStatus:
    (values(@)):
    - erroring
  (conditions[?type == 'DrainBlocked']):
  - status: "True"
