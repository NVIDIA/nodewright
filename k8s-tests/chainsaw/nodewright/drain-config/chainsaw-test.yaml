# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: drain-config
  labels:
    pool: interrupt
spec:
  timeouts:
    assert: 240s
    exec: 90s
  catch:
  - get:
      apiVersion: v1
      kind: Node
      selector: nodewright.nvidia.com/test-node=skyhooke2e
      format: yaml
  - get:
      apiVersion: nodewright.nvidia.com/v1alpha1
      kind: NodeWright
      name: drain-config-disable-eviction
      namespace: nodewright
      format: yaml
  - get:
      apiVersion: nodewright.nvidia.com/v1alpha1
      kind: NodeWright
      name: drain-config-timeout
      namespace: nodewright
      format: yaml
  - get:
      apiVersion: v1
      kind: Pod
      namespace: nodewright
      selector: app in (drain-config-pdb,drain-config-blocker)
      format: yaml
  steps:
  - name: disable-eviction-bypasses-pdb
    description: Verify disableEviction deletes through a zero-disruption PDB and lets the interrupt complete
    try:
    - script:
        content: |
          ../nodewright-cli reset drain-config-disable-eviction --confirm 2>/dev/null || true
          kubectl -n nodewright delete nodewright drain-config-disable-eviction --ignore-not-found --wait=false
          kubectl -n nodewright delete deployment drain-config-pdb --ignore-not-found --wait=false
          kubectl -n nodewright delete pdb drain-config-pdb --ignore-not-found
          kubectl -n nodewright delete configmap drain-config-original-pod --ignore-not-found
          kubectl -n nodewright delete pod -l app=drain-config-pdb --ignore-not-found --wait=false
    - apply:
        file: disable-eviction.yaml
    - script:
        content: |
          kubectl -n nodewright rollout status deployment/drain-config-pdb --timeout=60s
          pod="$(kubectl -n nodewright get pod -l app=drain-config-pdb -o jsonpath='{.items[0].metadata.name}')"
          kubectl -n nodewright wait --for=condition=Ready "pod/${pod}" --timeout=30s
          kubectl -n nodewright create configmap drain-config-original-pod --from-literal=name="${pod}" --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n nodewright wait --for=jsonpath='{.status.disruptionsAllowed}'=0 pdb/drain-config-pdb --timeout=60s
    - apply:
        file: disable-eviction-nodewright.yaml
    - script:
        content: |
          kubectl -n nodewright wait --for=condition=Ready nodewright/drain-config-disable-eviction --timeout=180s
    - script:
        content: |
          pod="$(kubectl -n nodewright get configmap drain-config-original-pod -o jsonpath='{.data.name}')"
          if kubectl -n nodewright get pod "${pod}" >/dev/null 2>&1; then
            echo "expected original PDB-protected pod ${pod} to be deleted directly"
            exit 1
          fi
    finally:
    - script:
        content: |
          ../nodewright-cli reset drain-config-disable-eviction --confirm 2>/dev/null || true
          kubectl -n nodewright delete nodewright drain-config-disable-eviction --ignore-not-found --wait=false
          kubectl -n nodewright delete deployment drain-config-pdb --ignore-not-found --wait=false
          kubectl -n nodewright delete pdb drain-config-pdb --ignore-not-found
          kubectl -n nodewright delete configmap drain-config-original-pod --ignore-not-found
          kubectl -n nodewright delete pod -l app=drain-config-pdb --ignore-not-found --wait=false
          kubectl get nodes -l nodewright.nvidia.com/test-node=skyhooke2e -o name | while read -r node; do kubectl uncordon "${node}" || true; done
  - name: timeout-surfaces-erroring
    description: Verify timeout marks the node erroring, keeps reporting the drain blocker, and emits a drain event when drain cannot proceed
    try:
    - script:
        content: |
          ../nodewright-cli reset drain-config-timeout --confirm 2>/dev/null || true
          kubectl -n nodewright delete nodewright drain-config-timeout --ignore-not-found --wait=false
          kubectl -n nodewright delete pod drain-config-blocker --ignore-not-found --wait=false
    - apply:
        file: timeout.yaml
    - wait:
        apiVersion: v1
        kind: Pod
        name: drain-config-blocker
        namespace: nodewright
        timeout: 30s
        for:
          condition:
            name: Ready
            value: 'true'
    - script:
        content: |
          kubectl -n nodewright wait --for=jsonpath='{.status.status}'=erroring nodewright/drain-config-timeout --timeout=180s
    - assert:
        file: timeout-assert.yaml
    - script:
        content: |
          for _ in $(seq 1 30); do
            events="$(kubectl get events -A -o jsonpath='{range .items[*]}{.metadata.namespace}{"\t"}{.reason}{"\t"}{.action}{"\t"}{.involvedObject.kind}{"\t"}{.involvedObject.name}{"\t"}{.regarding.kind}{"\t"}{.regarding.name}{"\t"}{.message}{"\t"}{.note}{"\n"}{end}' 2>/dev/null || true)"
            if printf "%s\n" "${events}" | grep -F "Drain" | grep -F "drain-config-timeout" | grep -F "drain timed out"; then
              exit 0
            fi
            sleep 2
          done
          printf "%s\n" "${events}"
          echo "expected drain timeout event for drain-config-timeout"
          exit 1
    finally:
    - script:
        content: |
          ../nodewright-cli reset drain-config-timeout --confirm 2>/dev/null || true
          kubectl -n nodewright delete nodewright drain-config-timeout --ignore-not-found --wait=false
          kubectl -n nodewright delete pod drain-config-blocker --ignore-not-found --wait=false
          kubectl get nodes -l nodewright.nvidia.com/test-node=skyhooke2e -o name | while read -r node; do kubectl uncordon "${node}" || true; done
