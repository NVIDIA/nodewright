apiVersion: v1
kind: Node
metadata:
  labels:
    nodewright.nvidia.com/test-node: skyhooke2e
    nodewright.nvidia.com/status_validate-packages: in_progress
  annotations: 
    ("nodewright.nvidia.com/nodeState_validate-packages" && parse_json("nodewright.nvidia.com/nodeState_validate-packages")): 
      {
        "invalid-env|5.4.3": {
            "name": "invalid-env",
            "version": "5.4.3",
            "image": "ghcr.io/nvidia/skyhook/agentless",
            "stage": "apply",
            "state": "in_progress"
        },
        "invalid-image|3.2.3-bogus": {
            "name": "invalid-image",
            "version": "3.2.3-bogus",
            "image": "ghcr.io/nvidia/skyhook/agentless",
            "stage": "apply",
            "state": "erroring"
        },
        "invalid-resources|1.2.3": {
            "name": "invalid-resources",
            "version": "1.2.3",
            "image": "ghcr.io/nvidia/skyhook/agentless",
            "stage": "apply",
            "state": "in_progress"
        }
      }
    nodewright.nvidia.com/status_validate-packages: in_progress
status:
  (conditions[?type == 'nodewright.nvidia.com/validate-packages/NotReady']):
  - reason: "Incomplete"
    status: "True"
  (conditions[?type == 'nodewright.nvidia.com/validate-packages/Erroring']):
  - reason: "Package(s) Erroring or Unknown"
    status: "True"
---
apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: validate-packages
status:
  status: in_progress
  nodeState:
    (values(@)):
    - invalid-env|5.4.3:
        name: invalid-env
        state: in_progress
        version: '5.4.3'
        image: ghcr.io/nvidia/skyhook/agentless
        stage: apply
      invalid-image|3.2.3-bogus:
        name: invalid-image
        state: erroring
        version: '3.2.3-bogus'
        image: ghcr.io/nvidia/skyhook/agentless
        stage: apply
      invalid-resources|1.2.3:
        name: invalid-resources
        state: in_progress
        version: '1.2.3'
        image: ghcr.io/nvidia/skyhook/agentless
        stage: apply
  nodeStatus:
    # grab values should be one and is erroring
    (values(@)):
    - erroring
