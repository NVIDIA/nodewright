apiVersion: v1
kind: Node
metadata:
  labels:
    nodewright.nvidia.com/test-node: skyhooke2e
    nodewright.nvidia.com/status_validate-packages: complete
  annotations:
    ("nodewright.nvidia.com/nodeState_validate-packages" && parse_json("nodewright.nvidia.com/nodeState_validate-packages")): 
      {
        "invalid-env|5.4.3": {
            "name": "invalid-env",
            "version": "5.4.3",
            "image": "ghcr.io/nvidia/skyhook/agentless",
            "stage": "config",
            "state": "complete"
        },
        "invalid-image|3.2.3": {
            "name": "invalid-image",
            "version": "3.2.3",
            "image": "ghcr.io/nvidia/skyhook/agentless",
            "stage": "config",
            "state": "complete"
        },
        "invalid-resources|1.2.3": {
            "name": "invalid-resources",
            "version": "1.2.3",
            "image": "ghcr.io/nvidia/skyhook/agentless",
            "stage": "config",
            "state": "complete"
        }
     }
    nodewright.nvidia.com/status_validate-packages: complete
status:
  (conditions[?type == 'nodewright.nvidia.com/validate-packages/NotReady']):
  - reason: "Complete"
    status: "False"
  (conditions[?type == 'nodewright.nvidia.com/validate-packages/Erroring']):
  - reason: "Not Erroring"
    status: "False"
---
apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: validate-packages
status:
  status: complete
  observedGeneration: 2
  nodeState:
    (values(@)):
    - invalid-env|5.4.3:
        image: ghcr.io/nvidia/skyhook/agentless
        name: invalid-env
        stage: config
        state: complete
        version: 5.4.3
      invalid-image|3.2.3:
        image: ghcr.io/nvidia/skyhook/agentless
        name: invalid-image
        stage: config
        state: complete
        version: 3.2.3
      invalid-resources|1.2.3:
        image: ghcr.io/nvidia/skyhook/agentless
        name: invalid-resources
        stage: config
        state: complete
        version: 1.2.3
  nodeStatus:
   # grab values should be one and is complete
    (values(@)):
      - complete
