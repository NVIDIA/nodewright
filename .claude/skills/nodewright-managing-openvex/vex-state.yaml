# Working state for the `nodewright-managing-openvex` skill. Read at the start
# of every invocation, updated at the end of every invocation.
#
# THE LIFECYCLE IS THE ENTIRE POINT OF THIS FILE. Entries are written so they
# can be deleted, and deleting them is the job, not an optional tidy-up. State
# that is never removed is exactly what turned a sibling project's document-level
# `tooling` field into 8,010 bytes of accumulated prose that then shipped,
# signed, on seven release images (NVIDIA/aicr#2706). This file exists so that
# never has to live in `.openvex.json`; it only works if entries leave.
#
# THE RULE: every entry must say what would invalidate it. An entry that cannot
# state that is not state. It is prose, and it belongs in a PR description or
# nowhere.
#
# Three kinds of entry, each with its own deletion rule:
#
#   deferred_verifications
#     A check that could not complete in the session that wrote it because it
#     needs a later CI run or a later release. `resolves_when` must name the
#     OUTCOME, never the event that merely makes the check runnable. "The
#     release published" is not a result; "the HIGH+ count dropped by the
#     number of findings the statement covers" is.
#     DELETE once the check has been run AND passed. A failed check is not a
#     resolution; it is the finding you are now triaging, and it belongs in an
#     issue rather than here.
#
#   known_negatives
#     Work already done that came back negative, recorded so nobody repeats it.
#     Carries `invalidated_by`: the upstream event that makes the negative worth
#     rechecking.
#     DELETE when `invalidated_by` fires. Do not rewrite it as history; the
#     recheck's result is the new entry, if one is needed at all.
#
#   deliberate_exclusions
#     A decision not to act, recorded so the next maintainer does not silently
#     reverse it. Carries `invalidated_by`: the condition under which the
#     decision should be revisited.
#     DELETE when that condition changes. The decision is then live again and
#     gets made afresh, not inherited.

deferred_verifications: []

known_negatives: []

deliberate_exclusions:
  - id: agent-x-text-v0.38.0-kept-for-v7.0.0
    opened: 2026-10-05
    what: >-
      The agent ships golang.org/x/text v0.38.0 (GO-2026-5970 /
      CVE-2026-56852) on release/agent/v7.0.x on purpose, covered by a
      not_affected statement rather than by the v0.39.0 bump. It gives a
      downstream consumer a real finding with a signed VEX statement attached
      to the image, to test that its OCI-referrer VEX ingestion suppresses it.
      Do not backport an x/text bump to release/agent/v7.0.x while this holds.
    invalidated_by: >-
      The downstream ingestion test is complete, or the agent starts importing
      golang.org/x/text/unicode/norm (which makes the statement false). Then
      bump x/text and let the versioned subcomponent purl expire the statement.
