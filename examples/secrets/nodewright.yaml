# Hands a Kubernetes Secret to a package as an environment variable.
#
# The Secret is not part of this manifest. Package pods run in the operator's
# namespace, so the Secret must be created there first; see README.md.
#
# Opt a node in with:
#   kubectl label node <node> nodewright.nvidia.com/example=secrets

apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: secrets-demo
spec:
  nodeSelectors:
    matchLabels:
      nodewright.nvidia.com/example: secrets
  packages:
    use-secret:
      version: 1.0.0
      image: ghcr.io/nvidia/nodewright-packages/shellscript
      env:
        - name: EXAMPLE_TOKEN
          valueFrom:
            secretKeyRef:
              name: nodewright-example
              key: token
      configMap:
        apply.sh: |-
          #!/bin/bash
          # Never print the value: package logs are readable by anyone who can
          # read pod logs in the operator's namespace.
          if [ -z "${EXAMPLE_TOKEN}" ]; then
            echo "EXAMPLE_TOKEN is empty"
            exit 1
          fi
          echo "EXAMPLE_TOKEN is set"
        apply_check.sh: |-
          #!/bin/bash
          test -n "${EXAMPLE_TOKEN}"
