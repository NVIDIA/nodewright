# A diamond-shaped package DAG:
#
#            base
#           /    \
#    service-a  service-b     <- run in parallel, once base is complete
#           \    /
#            report           <- runs last, prints the shared log
#
# Opt a node in with:
#   kubectl label node <node> nodewright.nvidia.com/example=dependencies

apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: dependencies-demo
spec:
  nodeSelectors:
    matchLabels:
      nodewright.nvidia.com/example: dependencies
  packages:
    base:
      version: 1.0.0
      image: ghcr.io/nvidia/nodewright-packages/shellscript
      configMap:
        apply.sh: |-
          #!/bin/bash
          mkdir -p /etc/nodewright-example/dependencies
          echo "$(date -u +%T) base: start" >> /etc/nodewright-example/dependencies/order.log
          sleep 5
          echo "$(date -u +%T) base: done" >> /etc/nodewright-example/dependencies/order.log
        apply_check.sh: |-
          #!/bin/bash
          grep -q "base: done" /etc/nodewright-example/dependencies/order.log

    service-a:
      version: 1.0.0
      image: ghcr.io/nvidia/nodewright-packages/shellscript
      dependsOn:
        base: 1.0.0
      configMap:
        apply.sh: |-
          #!/bin/bash
          echo "$(date -u +%T) service-a: start" >> /etc/nodewright-example/dependencies/order.log
          sleep 10
          echo "$(date -u +%T) service-a: done" >> /etc/nodewright-example/dependencies/order.log
        apply_check.sh: |-
          #!/bin/bash
          grep -q "service-a: done" /etc/nodewright-example/dependencies/order.log

    service-b:
      version: 1.0.0
      image: ghcr.io/nvidia/nodewright-packages/shellscript
      dependsOn:
        base: 1.0.0
      configMap:
        apply.sh: |-
          #!/bin/bash
          echo "$(date -u +%T) service-b: start" >> /etc/nodewright-example/dependencies/order.log
          sleep 10
          echo "$(date -u +%T) service-b: done" >> /etc/nodewright-example/dependencies/order.log
        apply_check.sh: |-
          #!/bin/bash
          grep -q "service-b: done" /etc/nodewright-example/dependencies/order.log

    report:
      version: 1.0.0
      image: ghcr.io/nvidia/nodewright-packages/shellscript
      dependsOn:
        service-a: 1.0.0
        service-b: 1.0.0
      configMap:
        apply.sh: |-
          #!/bin/bash
          echo "--- order in which the packages ran on $(hostname) ---"
          cat /etc/nodewright-example/dependencies/order.log
        apply_check.sh: |-
          #!/bin/bash
          grep -q "service-a: done" /etc/nodewright-example/dependencies/order.log &&
            grep -q "service-b: done" /etc/nodewright-example/dependencies/order.log
