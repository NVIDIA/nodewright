# Rolls a package out under the `staged-rollout` DeploymentPolicy. Apply
# deployment-policy.yaml first: the webhook rejects a reference to a policy that
# does not exist.
#
# Opt nodes in with:
#   kubectl label node <node> nodewright.nvidia.com/example=rollout
# then sort them into compartments with the example-tier label; see README.md.

apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: rollout-demo
spec:
  deploymentPolicy: staged-rollout
  nodeSelectors:
    matchLabels:
      nodewright.nvidia.com/example: rollout
  packages:
    stamp:
      version: 1.0.0
      image: ghcr.io/nvidia/nodewright-packages/shellscript
      configMap:
        apply.sh: |-
          #!/bin/bash
          mkdir -p /etc/nodewright-example/rollout
          if [ -e /etc/nodewright-example/rollout/fail ]; then
            echo "$(hostname): /etc/nodewright-example/rollout/fail exists, failing on purpose"
            exit 1
          fi
          sleep 20
          date -u > /etc/nodewright-example/rollout/stamp
        apply_check.sh: |-
          #!/bin/bash
          test -s /etc/nodewright-example/rollout/stamp
