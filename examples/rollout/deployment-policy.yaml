# A rollout shaped per group of nodes. Each compartment is a named node selector
# with its own batch strategy; they roll out independently of one another.
#
#   canary      one node at a time, stop on the first failed batch
#   production  starts at one node and grows by one after each good batch
#   default     every node that matches no compartment: two at a time
#
# `safetyLimit: 100` means failureThreshold is enforced for the whole rollout.
# At the default of 50 the rollout commits to finishing once half the
# compartment has been processed, whatever failureThreshold says.

apiVersion: nodewright.nvidia.com/v1alpha1
kind: DeploymentPolicy
metadata:
  name: staged-rollout
spec:
  default:
    budget:
      percent: 100
    strategy:
      fixed:
        initialBatch: 2
        batchThreshold: 100
        failureThreshold: 1
        safetyLimit: 100
  compartments:
    - name: canary
      selector:
        matchLabels:
          nodewright.nvidia.com/example-tier: canary
      budget:
        count: 1
      strategy:
        fixed:
          initialBatch: 1
          batchThreshold: 100
          failureThreshold: 1
          safetyLimit: 100
    - name: production
      selector:
        matchLabels:
          nodewright.nvidia.com/example-tier: production
      budget:
        percent: 50
      strategy:
        linear:
          initialBatch: 1
          delta: 1
          batchThreshold: 100
          failureThreshold: 2
          safetyLimit: 100
