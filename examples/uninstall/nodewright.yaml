# A package that supports explicit uninstall.
#
# `uninstall.enabled: true` declares that the package ships uninstall.sh and
# uninstall_check.sh. Nothing is uninstalled until `uninstall.apply` is flipped
# to true; see README.md for the walkthrough.
#
# Opt a node in with:
#   kubectl label node <node> nodewright.nvidia.com/example=uninstall

apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  name: uninstall-demo
spec:
  nodeSelectors:
    matchLabels:
      nodewright.nvidia.com/example: uninstall
  packages:
    marker:
      version: 1.0.0
      image: ghcr.io/nvidia/nodewright-packages/shellscript
      uninstall:
        enabled: true
        apply: false
      configMap:
        apply.sh: |-
          #!/bin/bash
          mkdir -p /etc/nodewright-example/uninstall
          echo "managed by nodewright" > /etc/nodewright-example/uninstall/marker
        apply_check.sh: |-
          #!/bin/bash
          grep -q "managed by nodewright" /etc/nodewright-example/uninstall/marker
        uninstall.sh: |-
          #!/bin/bash
          rm -f /etc/nodewright-example/uninstall/marker
          rmdir /etc/nodewright-example/uninstall 2>/dev/null || true
        uninstall_check.sh: |-
          #!/bin/bash
          test ! -e /etc/nodewright-example/uninstall/marker
