# The hello-world example used by docs/getting-started/quickstart.md.
#
# The node selector below matches nothing until you label a node, which keeps
# the blast radius at one node:
#
#   kubectl label node <node> nodewright.nvidia.com/quickstart=true

apiVersion: nodewright.nvidia.com/v1alpha1
kind: NodeWright
metadata:
  labels:
    app.kubernetes.io/part-of: nodewright-operator
    app.kubernetes.io/created-by: nodewright-operator
  name: demo
  annotations:
    nodewright.nvidia.com/pause: "false"
    nodewright.nvidia.com/disable: "false"
spec:
  nodeSelectors:
    matchLabels:
      nodewright.nvidia.com/quickstart: "true"
  packages:
    hello-world:
      version: 1.1.2
      image: ghcr.io/nvidia/nodewright-packages/shellscript
      configMap:
        # Stages run in order: apply first, then config. Each stage runs its
        # script, then its _check script, and the stage is only done once the
        # check passes.
        apply.sh: |-
          #!/bin/bash
          sleep 1
          echo "Hello, apply!"
        apply_check.sh: |-
          #!/bin/bash
          sleep 1
          echo "Hello, apply check!"
        # Runs only after apply and apply_check have succeeded.
        config.sh: |-
          #!/bin/bash
          sleep 1
          echo "Hello, config!"
        config_check.sh: |-
          #!/bin/bash
          sleep 1
          echo "Hello, config check!"
