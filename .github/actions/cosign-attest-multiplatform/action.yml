# Per-platform SBOM and VEX attestation for a multi-platform index.
#
# WHY THIS EXISTS, AND WHY THE SUBJECTS DIFFER
#
# NodeWright publishes multi-platform indexes: the operator and agent images
# (linux/amd64, linux/arm64) and the CLI, an index of single-binary artifacts for
# every OS and architecture it is built for. The single-subject action next
# door, cosign-sign-sbom, attaches one CycloneDX SBOM
# to the index digest. An SBOM describes exactly one root filesystem, so an SBOM
# on an index honestly describes neither child, and a consumer who resolves
# linux/amd64 and enumerates referrers on that manifest finds nothing at all.
# This action splits the evidence so each piece hangs on the subject it is true
# about. cosign-sign-sbom stays in use for the Helm chart, which is a single OCI
# artifact with no platforms and therefore has nothing to split.
#
# Evidence            Subject             Why
# ------------------  ------------------  -----------------------------------
# cosign signature    Index               NodeWright signs today and must keep
#                                         doing so. AICR does not sign, and
#                                         attestation-only images hit a known
#                                         issue with Kyverno's
#                                         ImageValidatingPolicy.
# CycloneDX SBOM      Each platform       One SBOM describes one root
#                     manifest            filesystem, or the one binary an
#                                         artifact manifest ships.
# OpenVEX             Each platform       A VEX claim is verifiable only when
#                     manifest            its product identifier binds to the
#                                         manifest it covers.
# SLSA provenance     Index               Produced by the CALLING workflow's
#                     (not done here)     actions/attest-build-provenance step.
#                                         Provenance is about the build, not
#                                         about one root filesystem, so it
#                                         stays on the index. Do not move it
#                                         here.
#
# WHY TWO FORMATS RATHER THAN TWO CYCLONEDX DOCUMENTS
#
# CycloneDX can express VEX, so folding the VEX claims into the SBOM looks like
# a simplification. It is not, because of how the evidence is discovered.
# `cosign attest --type cyclonedx` stamps predicate type
# https://cyclonedx.org/bom on whatever predicate it is handed, and an OCI
# referrer descriptor carries only digest, mediaType, size, artifactType and
# annotations. There is no name field. Two CycloneDX documents on one manifest
# are therefore indistinguishable in a referrers listing without pulling and
# decoding every payload to guess which is which. `--type openvex` stamps
# https://openvex.dev/ns instead, so the listing stays self-describing and a
# scanner can fetch only the document it wants. Do not unify them.
#
# That listing is self-describing only from cosign v3.1.0 onward, which is why
# cosign-version below is a floor rather than a preference. Up to and including
# v3.0.6, `cosign attest` initialises the bundle's predicate type to
# https://sigstore.dev/cosign/sign/v1 and, on the default
# `--use-signing-config=true` path, returns before overwriting it with the
# requested type, so the referrer annotation
# `dev.sigstore.bundle.predicateType` reads cosign/sign/v1 on every
# attestation. The signed in-toto statement still carries the right predicate,
# so `cosign verify-attestation --type` is unaffected: it decodes payloads
# rather than reading annotations. What breaks is the discovery step this
# section exists to enable.
#
# WHY VERIFICATION DOCS USE COSIGN AND NOT A REFERRERS API CALL
#
# ghcr.io does not implement the OCI 1.1 /v2/<name>/referrers/<digest> endpoint;
# it answers 404 MANIFEST_UNKNOWN. Every attestation published here therefore
# lands through the spec's referrers tag fallback, an ordinary index pushed to
# the tag `sha256-<hex>`. That is transparent to cosign and to oras clients,
# which fall back automatically, but it is why the documented verification path
# is `cosign verify-attestation` rather than a raw referrers query: the raw
# query returns nothing against this registry even when the evidence is present.
#
# WHY THE SBOM SOURCE IS AN INPUT
#
# For an image, syft reads the platform manifest from the registry and catalogs
# its root filesystem. A CLI platform manifest is an OCI artifact whose one layer
# is the raw binary, with no root filesystem for syft to unpack, so the caller
# hands over the binaries it pushed (binaries-dir) and syft catalogs the Go
# module data embedded in each. The SBOM still hangs on the platform manifest
# that ships those exact bytes.

name: Cosign attest multi-platform
description: Sign a multi-platform index and attest a per-platform CycloneDX SBOM and OpenVEX document to each platform manifest.

inputs:
  subject-name:
    description: OCI repository without tag or digest.
    required: true
  index-digest:
    description: Multi-platform index digest in sha256:<hex> form.
    required: true
  platforms:
    description: >-
      Space-separated <os>/<arch> platforms the index ships. Every one gets its
      own SBOM and VEX, and the action fails if the index ships a platform not
      listed here, so a platform added to the build cannot release without
      evidence.
    required: false
    default: "linux/amd64 linux/arm64"
  binaries-dir:
    description: >-
      Directory holding one subdirectory per platform, named <os>-<arch>, each
      containing exactly the file that platform's manifest ships. When set, each
      SBOM is generated from that file rather than from the registry. Leave
      empty for container images.
    required: false
    default: ""
  syft-version:
    description: Syft version used to generate CycloneDX SBOMs.
    required: false
    default: "v1.38.0"
  cosign-version:
    description: >-
      Cosign release to install. Pinned rather than inherited: the installer's
      default moves between installer releases, which would make the
      on-registry bundle format an implicit dependency of whatever
      cosign-installer happened to ship. v3.1.0 is also a floor, not just a
      preference, for the reason recorded under WHY TWO FORMATS above: cosign
      through v3.0.6 writes the referrer annotation
      dev.sigstore.bundle.predicateType as https://sigstore.dev/cosign/sign/v1
      on every attestation, so the CycloneDX and OpenVEX documents this action
      publishes are indistinguishable in a referrers listing and the
      self-describing layout does not materialise.
    required: false
    default: "v3.1.3"

outputs:
  platform-digests:
    description: >-
      Space-separated <os>/<arch>=<digest> pairs, one per platform in the order
      of the platforms input: the manifests the SBOM and VEX were attested to.
      Pass it unchanged to cosign-verify-release.
    value: ${{ steps.platforms.outputs.platform-digests }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      shell: bash
      env:
        SUBJECT_NAME: ${{ inputs.subject-name }}
        INDEX_DIGEST: ${{ inputs.index-digest }}
        PLATFORMS: ${{ inputs.platforms }}
        BINARIES_DIR: ${{ inputs.binaries-dir }}
      run: |
        set -euo pipefail

        if [ -z "${SUBJECT_NAME}" ]; then
          echo "::error::subject-name is required"
          exit 1
        fi
        if ! [[ "${INDEX_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          echo "::error::index-digest must be in sha256:<64 hex> form, got '${INDEX_DIGEST}'"
          exit 1
        fi
        if [ -z "${PLATFORMS// /}" ]; then
          echo "::error::platforms must name at least one <os>/<arch>"
          exit 1
        fi
        for platform in ${PLATFORMS}; do
          if ! [[ "${platform}" =~ ^[a-z0-9]+/[a-z0-9]+$ ]]; then
            echo "::error::platform '${platform}' is not in <os>/<arch> form"
            exit 1
          fi
        done

        # Each platform's SBOM is generated from exactly one file. Checked here,
        # before anything is resolved or signed, so a build that skipped a
        # platform fails on the missing binary rather than half-way through.
        if [ -n "${BINARIES_DIR}" ]; then
          for platform in ${PLATFORMS}; do
            dir="${BINARIES_DIR}/${platform/\//-}"
            shopt -s nullglob
            files=("${dir}"/*)
            shopt -u nullglob
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "::error::${dir} must hold exactly one file, the binary ${platform} ships; found ${#files[@]} entries"
              exit 1
            fi
          done
        fi

    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        cosign-release: ${{ inputs.cosign-version }}

    - name: Install crane
      uses: ./.github/actions/setup-crane

    - name: Install Syft
      id: syft
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        syft-version: ${{ inputs.syft-version }}

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: tools/go.mod
        # The tools module is pure stdlib and has no go.sum, so there is nothing
        # for setup-go's cache to key on and enabling it fails the step.
        cache: false

    - name: Resolve per-platform digests
      id: platforms
      shell: bash
      env:
        SUBJECT_NAME: ${{ inputs.subject-name }}
        INDEX_DIGEST: ${{ inputs.index-digest }}
        PLATFORMS: ${{ inputs.platforms }}
      run: |
        set -euo pipefail

        subject="${SUBJECT_NAME}@${INDEX_DIGEST}"
        declare -A resolved_by=()
        pairs=()

        # This action covers exactly the platforms it is given. Nothing forces
        # the index to contain only those, so a platform added to the build
        # would publish with no SBOM and no VEX, and every check in this file
        # would still pass: the loop would resolve and attest the platforms it
        # knows and never look at the new one.
        #
        # Enumerate what the index actually ships and refuse anything
        # unrecognised. `unknown/unknown` is skipped because that is how buildx
        # records attestation manifests, which are evidence about the image
        # rather than a platform of it.
        shipped="$(timeout --foreground 120s crane manifest "${subject}" \
          | jq -r '.manifests[]? | "\(.platform.os // "unknown")/\(.platform.architecture // "unknown")"' \
          | sort -u)"
        for platform in ${shipped}; do
          case "${platform}" in
            unknown/unknown) continue ;;
          esac
          case " ${PLATFORMS} " in
            *" ${platform} "*) ;;
            *)
              echo "::error::${subject} ships ${platform}, which this action was not asked to attest. Add it to the platforms input, or it releases with no SBOM and no VEX."
              exit 1
              ;;
          esac
        done

        for platform in ${PLATFORMS}; do
          # An absent platform fails on its own: crane prints
          # "no child with platform <os>/<arch> in index ..." and exits 1.
          if ! digest="$(timeout --foreground 120s crane digest --platform "${platform}" "${subject}")"; then
            echo "::error::crane could not resolve ${platform} in ${subject}"
            exit 1
          fi

          if ! [[ "${digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::crane returned '${digest}' for ${platform}, which is not sha256:<64 hex>"
            exit 1
          fi

          # crane digest answers with a reference's OWN digest when that
          # reference is a plain image manifest rather than an index, so a
          # single-platform push succeeds here and hands back the index digest
          # unchanged. Equality is the only signal that this happened, and
          # without the check the whole action would quietly reattach every
          # SBOM to the index, which is the exact bug it exists to fix.
          if [ "${digest}" = "${INDEX_DIGEST}" ]; then
            echo "::error::${platform} resolved to the index digest itself; ${subject} is not a multi-platform index"
            exit 1
          fi

          # Two platforms resolving to one manifest means the index lost a
          # platform or the same child was selected twice. Every check above
          # passes in that case, and the result is identical SBOMs published as
          # if they described different platforms: a referrers listing reads as
          # complete while one platform ships with no evidence of its own.
          if [ -n "${resolved_by[${digest}]:-}" ]; then
            echo "::error::${resolved_by[${digest}]} and ${platform} both resolved to ${digest}; a platform was lost or the index was resolved twice"
            exit 1
          fi
          resolved_by["${digest}"]="${platform}"

          pairs+=("${platform}=${digest}")
          echo "${platform} -> ${digest}"
        done

        echo "platform-digests=${pairs[*]}" >> "${GITHUB_OUTPUT}"

    - name: Generate and validate per-platform evidence
      id: evidence
      shell: bash
      env:
        SUBJECT_NAME: ${{ inputs.subject-name }}
        INDEX_DIGEST: ${{ inputs.index-digest }}
        PLATFORM_DIGESTS: ${{ steps.platforms.outputs.platform-digests }}
        BINARIES_DIR: ${{ inputs.binaries-dir }}
        SYFT: ${{ steps.syft.outputs.cmd }}
        GOFLAGS: -mod=readonly
      run: |
        set -euo pipefail

        if [ -z "${SYFT}" ]; then
          echo "::error::Syft command was not provided by the installer"
          exit 1
        fi

        # Keyed by index digest so a workflow that attests several images in one
        # job does not overwrite one image's evidence with another's.
        evidence_dir="${RUNNER_TEMP}/nodewright-evidence/${INDEX_DIGEST#sha256:}"
        mkdir -p "${evidence_dir}"
        echo "evidence-dir=${evidence_dir}" >> "${GITHUB_OUTPUT}"

        vex_source="${GITHUB_WORKSPACE}/.openvex.json"

        # The committed source is checked before anything derives from it: a
        # document that violates the OpenVEX v0.2.0 contract cannot produce a
        # projection worth signing, and one failure here is cheaper to read
        # than the same failure repeated once per platform below. Source mode
        # switches off the one rule that does not apply to it, since a
        # committed document carries bare `pkg:oci/<image>` products by design.
        go -C "${GITHUB_WORKSPACE}/tools" run ./cmd/openvex validate -mode source -in "${vex_source}"
        # Counted for THIS image, not across the whole document. `.openvex.json`
        # is shared by every released image, so a document holding one
        # operator-only statement has a legitimately empty agent projection.
        # Counting all statements would abort the agent release the moment the
        # first operator statement was written.
        #
        # The name matching mirrors parseOCIPURLName in tools/internal/openvex:
        # strip the pkg:oci/ prefix, then truncate at the first `@`, `?` or `#`,
        # so a product carrying a digest or a repository_url qualifier still
        # matches. Keep the two in step.
        subject_basename="$(basename "${SUBJECT_NAME}")"
        source_statements="$(jq --arg name "${subject_basename}" '
          def ociname($id):
            if ($id | type) == "string" and ($id | startswith("pkg:oci/"))
            then ($id | ltrimstr("pkg:oci/") | split("@")[0] | split("?")[0] | split("#")[0])
            else null end;
          [ .statements[]?
            | select([ (.products // [])[]?
                       | (ociname(.["@id"]), ociname(.identifiers.purl))
                       | select(. != null) ] | index($name))
          ] | length' "${vex_source}")"

        for pair in ${PLATFORM_DIGESTS}; do
          platform="${pair%%=*}"
          digest="${pair#*=}"
          slug="${platform/\//-}"

          sbom_file="${evidence_dir}/${slug}.cyclonedx.json"
          # Both sources take an explicit scheme. Without one syft walks its
          # provider chain and tries the local Docker daemon first, which on an
          # amd64 runner cannot honestly hand back a linux/arm64 root
          # filesystem. Every claim this action makes rests on the SBOM
          # describing the manifest it is attested to, so the source is pinned
          # rather than inferred.
          #
          # Both are bounded: syft checks for its own updates over the network
          # even when scanning a local file. The registry pull gets a longer
          # deadline because it pulls a full image per platform, not a
          # manifest. This runs after the release is pushed and before anything
          # is signed, so a stall would otherwise hold a half-published release
          # open until the job's own limit.
          if [ -n "${BINARIES_DIR}" ]; then
            binary=("${BINARIES_DIR}/${slug}"/*)
            # The SBOM comes from a local file but is attested to the manifest,
            # and nothing else ties the two together: a stale or mis-staged
            # binary would publish a signed SBOM describing bytes the manifest
            # does not ship. The manifest must ship exactly this one file.
            layers="$(timeout --foreground 120s crane manifest "${SUBJECT_NAME}@${digest}" \
              | jq -r '[.layers[]?.digest] | join(" ")')"
            staged="sha256:$(sha256sum "${binary[0]}" | cut -d' ' -f1)"
            if [ "${layers}" != "${staged}" ]; then
              echo "::error::${platform} manifest ${digest} ships layer(s) '${layers}', but the staged ${binary[0]} is ${staged}; the SBOM would describe a different binary"
              exit 1
            fi
            timeout --foreground 120s \
              "${SYFT}" "file:${binary[0]}" -o "cyclonedx-json=${sbom_file}"
          else
            timeout --foreground 600s \
              "${SYFT}" "registry:${SUBJECT_NAME}@${digest}" -o "cyclonedx-json=${sbom_file}"
          fi

          # Asserted before anything is signed. `cosign attest --type cyclonedx`
          # stamps https://cyclonedx.org/bom on whatever predicate it is handed,
          # so a syft invocation that silently emitted some other format would
          # still publish a referrer that reads as a CycloneDX SBOM. A wrong
          # format that announces itself as right is worse than a missing one:
          # a consumer has no reason to look any further.
          bom_format="$(jq -r '.bomFormat // empty' "${sbom_file}")"
          if [ "${bom_format}" != "CycloneDX" ]; then
            echo "::error::${sbom_file} has bomFormat '${bom_format}', expected CycloneDX"
            exit 1
          fi

          vex_file="${evidence_dir}/${slug}.openvex.json"
          go -C "${GITHUB_WORKSPACE}/tools" run ./cmd/openvex bind \
            -in "${vex_source}" \
            -out "${vex_file}" \
            -image "${SUBJECT_NAME}" \
            -digest "${digest}"

          # Validated separately from the source above, and not as a formality.
          # Binding rewrites `products` on every statement it keeps, so the
          # source check covered different bytes than the ones cosign is about
          # to sign. Projection mode adds the rule that matters here: every
          # product identifier must end in this platform's digest, which is
          # what makes the claim tie to a manifest a scanner can match.
          go -C "${GITHUB_WORKSPACE}/tools" run ./cmd/openvex validate \
            -mode projection \
            -in "${vex_file}" \
            -digest "${digest}"

          # Every statement naming this image must survive binding. An empty
          # projection is legitimate when no statement names this image, which
          # is the normal case for a document covering several images.
          #
          # Both sides of this comparison apply the same matching rule through
          # different implementations: the count above in jq, `kept` via the Go
          # binder. So what it actually catches is those two drifting apart, and
          # it is worth keeping for that alone, since a drift would silently
          # change which statements reach signed evidence.
          #
          # It does NOT catch a product name that matches no released image at
          # all, for example a typo like pkg:oci/nodewright-operator: both
          # counts are then zero and agree. That check needs the set of images
          # the release actually publishes, which no single image's release job
          # knows, so it lives in tools/tests/releasepolicy where the set is
          # derivable from the workflows and a bad statement fails in the pull
          # request that introduces it rather than months later at release time.
          kept="$(jq '.statements | length' "${vex_file}")"
          if [ "${kept}" -ne "${source_statements}" ]; then
            echo "::error::.openvex.json has ${source_statements} statement(s) naming ${subject_basename} but ${kept} survived binding for ${platform}; a statement that names this image must reach its projection, or the release publishes a signed VEX claiming exceptions it does not carry"
            exit 1
          fi
        done

    # Signature on the index, not on the platforms. See the subject policy at
    # the top of this file.
    - name: Sign index
      shell: bash
      env:
        SUBJECT_NAME: ${{ inputs.subject-name }}
        INDEX_DIGEST: ${{ inputs.index-digest }}
      run: |
        set -euo pipefail
        timeout --foreground 120s cosign sign \
          --yes \
          --new-bundle-format=true \
          "${SUBJECT_NAME}@${INDEX_DIGEST}"

    - name: Attest per-platform SBOM and VEX
      shell: bash
      env:
        SUBJECT_NAME: ${{ inputs.subject-name }}
        PLATFORM_DIGESTS: ${{ steps.platforms.outputs.platform-digests }}
        EVIDENCE_DIR: ${{ steps.evidence.outputs.evidence-dir }}
      run: |
        set -euo pipefail

        for pair in ${PLATFORM_DIGESTS}; do
          platform="${pair%%=*}"
          digest="${pair#*=}"
          slug="${platform/\//-}"

          subject="${SUBJECT_NAME}@${digest}"

          # --new-bundle-format decides whether the attestation publishes
          # through the OCI referrers API or as a legacy `.att` tag, and the
          # flag's default has moved between cosign releases. Passing it
          # explicitly keeps the on-registry layout a decision this repo made
          # rather than one it inherited. cosign v3.1.0 marked the flag
          # deprecated, so each call now logs a deprecation line; it still
          # works and still defaults to true. Drop it from every call site,
          # and from the release-policy test that requires it, when a cosign
          # release removes it outright.
          timeout --foreground 120s cosign attest \
            --yes \
            --new-bundle-format=true \
            --type cyclonedx \
            --predicate "${EVIDENCE_DIR}/${slug}.cyclonedx.json" \
            "${subject}"

          timeout --foreground 120s cosign attest \
            --yes \
            --new-bundle-format=true \
            --type openvex \
            --predicate "${EVIDENCE_DIR}/${slug}.openvex.json" \
            "${subject}"
        done
