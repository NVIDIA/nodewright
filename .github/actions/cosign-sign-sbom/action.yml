name: Cosign sign and SBOM attest
description: Sign an OCI subject and attach a CycloneDX SBOM attestation.

inputs:
  subject-name:
    description: OCI repository without tag or digest.
    required: true
  subject-digest:
    description: OCI digest in sha256:<hex> form.
    required: true
  sbom-source:
    description: Source for Syft SBOM generation. Defaults to subject-name@subject-digest.
    required: false
    default: ""
  syft-version:
    description: Syft version used to generate CycloneDX SBOMs.
    required: false
    default: "v1.38.0"

outputs:
  sbom-file:
    description: Generated CycloneDX SBOM file.
    value: ${{ steps.sbom.outputs.sbom-file }}

runs:
  using: composite
  steps:
    - name: Install cosign
      uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      with:
        # Pinned, not left to the installer's default. The verify side pins the
        # same version and passes --new-bundle-format explicitly, so a Renovate
        # bump of the installer SHA to a release defaulting to a different
        # cosign major would leave signing and verification disagreeing about
        # the on-registry layout, and the chart job would fail at its final
        # verify with the artifact already pushed. Keep this equal to
        # cosign-attest-multiplatform's cosign-version default; a release-policy
        # test asserts it.
        cosign-release: "v3.0.6"

    - name: Install Syft
      id: syft
      uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
      with:
        syft-version: ${{ inputs.syft-version }}

    - name: Generate CycloneDX SBOM
      id: sbom
      shell: bash
      env:
        SUBJECT_NAME: ${{ inputs.subject-name }}
        SUBJECT_DIGEST: ${{ inputs.subject-digest }}
        SBOM_SOURCE: ${{ inputs.sbom-source }}
        SYFT: ${{ steps.syft.outputs.cmd }}
      run: |
        set -euo pipefail

        if [ -z "${SUBJECT_NAME}" ]; then
          echo "::error::subject-name is required"
          exit 1
        fi
        if ! [[ "${SUBJECT_DIGEST}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
          echo "::error::subject-digest must be in sha256:<64 hex> form"
          exit 1
        fi
        if [ -z "${SYFT}" ]; then
          echo "::error::Syft command was not provided by the installer"
          exit 1
        fi

        subject="${SUBJECT_NAME}@${SUBJECT_DIGEST}"
        if [ -z "${SBOM_SOURCE}" ]; then
          SBOM_SOURCE="${subject}"
        fi

        work_dir="${RUNNER_TEMP}/nodewright-sboms"
        mkdir -p "${work_dir}"
        safe_name="$(printf '%s' "${SUBJECT_NAME}" | tr '/:@' '---' | tr -c '[:alnum:]._-' '-')"
        sbom_file="${work_dir}/${safe_name}.cyclonedx.json"

        "${SYFT}" "${SBOM_SOURCE}" -o "cyclonedx-json=${sbom_file}"
        jq empty "${sbom_file}"
        echo "sbom-file=${sbom_file}" >> "${GITHUB_OUTPUT}"

    - name: Sign subject
      shell: bash
      env:
        SUBJECT_NAME: ${{ inputs.subject-name }}
        SUBJECT_DIGEST: ${{ inputs.subject-digest }}
      run: |
        set -euo pipefail
        timeout --foreground 120s cosign sign --yes --new-bundle-format=true "${SUBJECT_NAME}@${SUBJECT_DIGEST}"

    - name: Attach CycloneDX SBOM attestation
      shell: bash
      env:
        SUBJECT_NAME: ${{ inputs.subject-name }}
        SUBJECT_DIGEST: ${{ inputs.subject-digest }}
        SBOM_FILE: ${{ steps.sbom.outputs.sbom-file }}
      run: |
        set -euo pipefail
        timeout --foreground 120s cosign attest --yes --new-bundle-format=true --predicate "${SBOM_FILE}" --type cyclonedx "${SUBJECT_NAME}@${SUBJECT_DIGEST}"
