# Build and release CLI binaries when cli/* tags are pushed
name: CLI Release

on:
  push:
    tags:
      - cli/*

permissions:
  contents: read

env:
  # Opt all JS actions into Node 24 ahead of GitHub's Node 20 phase-out.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases
      # git-cliff resolves each commit's author and PR number through the
      # GitHub API; listing pull requests needs this scope, and declaring
      # `contents` above would otherwise narrow GITHUB_TOKEN to just that.
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install git-cliff
        run: |
          GC_VERSION=$(curl -sSf --retry 3 --retry-delay 5 --retry-all-errors https://api.github.com/repos/orhun/git-cliff/releases/latest | grep '"tag_name"' | cut -d '"' -f 4)
          # Download to a file rather than piping into tar: a retried transfer
          # restarts from byte 0, which would replay bytes into a tar already
          # part-way through the stream.
          curl -sSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o /tmp/git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/${GC_VERSION}/git-cliff-${GC_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/git-cliff.tar.gz --wildcards --strip-components=1 "*/git-cliff"
          sudo mv git-cliff /usr/local/bin/

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Extract version from tag
        id: version
        run: |
          # Tag is cli/v0.1.0, extract v0.1.0
          VERSION="${GITHUB_REF_NAME#cli/}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building CLI version: ${VERSION}"
          # Release candidate tags (e.g. cli/v0.2.0-rc.1) → mark the GitHub
          # release as a prerelease so they don't become "Latest" on the
          # Releases page, matching release.yml. The strict tag-format check
          # lives in the release-notes step below; here we only need the
          # rc/stable split to set the prerelease flag.
          if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Build CLI binaries
        working-directory: operator
        run: make cli-release-build CLI_VERSION=${{ steps.version.outputs.version }}

      - name: Resolve published asset names
        id: assets
        working-directory: operator
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The install snippet in the release body has to name the exact
          # archives and binary that cli-release-build just produced. Deriving
          # both from dist/ instead of hard-coding them is what stops the
          # published curl commands from 404-ing the next time the naming
          # changes (they did, through the whole Skyhook -> NodeWright rename).
          # Every archive that gets uploaded is checked, not just the two the
          # notes document, and the platform list is read from dist/ rather than
          # restated here so adding a platform cannot quietly skip validation.
          shopt -s nullglob

          archives=(dist/*.tar.gz dist/*.zip)
          if [[ ${#archives[@]} -eq 0 ]]; then
            echo "::error::cli-release-build produced no archives in operator/dist/"
            exit 1
          fi
          if [[ ! -f dist/checksums.txt ]]; then
            echo "::error::cli-release-build produced no dist/checksums.txt"
            exit 1
          fi

          binary=""
          for archive in "${archives[@]}"; do
            case "${archive}" in
              *.tar.gz) mapfile -t entries < <(tar -tzf "${archive}") ;;
              *.zip)    mapfile -t entries < <(unzip -Z1 "${archive}") ;;
            esac
            if [[ ${#entries[@]} -ne 1 ]]; then
              echo "::error::${archive} should hold exactly one binary, found ${#entries[@]}: ${entries[*]-}"
              exit 1
            fi
            # Windows ships the same binary with a .exe suffix.
            name="${entries[0]%.exe}"
            if [[ -z "${binary}" ]]; then
              binary="${name}"
            elif [[ "${binary}" != "${name}" ]]; then
              echo "::error::archives disagree on the binary name: '${binary}' vs '${name}' in ${archive}"
              exit 1
            fi
            # An archive missing from checksums.txt is one the build did not
            # finish making; the release would upload it unverifiable.
            if ! awk '{print $2}' dist/checksums.txt | grep -qxF "$(basename "${archive}")"; then
              echo "::error::$(basename "${archive}") is missing from dist/checksums.txt"
              exit 1
            fi
          done

          # Membership in checksums.txt is not the same as a correct digest, and
          # the digests are what a user runs `shasum -c` against after
          # downloading. Verify them here so a release cannot publish checksum
          # data that fails against its own assets.
          ( cd dist && shasum -a 256 -c --strict -q checksums.txt )

          # cli-release-build leaves the raw per-platform binaries beside the
          # archives, so they are the build's own list of platforms. Checking
          # against them catches an archive step that skipped one, without
          # restating the platform matrix here where it could drift.
          for built in dist/*_"${VERSION}"_*; do
            case "${built}" in
              *.tar.gz|*.zip) continue ;;
              *.exe) want="${built%.exe}.zip" ;;
              *)     want="${built}.tar.gz" ;;
            esac
            if [[ ! -f "${want}" ]]; then
              echo "::error::cli-release-build made $(basename "${built}") but no $(basename "${want}")"
              exit 1
            fi
          done

          # Resolve the two platforms the install snippet actually documents.
          for platform in linux_amd64 darwin_arm64; do
            matches=(dist/*_"${VERSION}"_"${platform}".tar.gz)
            if [[ ${#matches[@]} -ne 1 ]]; then
              echo "::error::cli-release-build should produce exactly one dist/*_${VERSION}_${platform}.tar.gz, found ${#matches[@]}: ${matches[*]-}"
              exit 1
            fi
            echo "${platform}_archive=$(basename "${matches[0]}")" >> "$GITHUB_OUTPUT"
          done
          echo "binary=${binary}" >> "$GITHUB_OUTPUT"
          echo "Validated ${#archives[@]} archives, each holding '${binary}'"

      - name: Generate release notes
        id: release_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release notes are rendered WITHOUT --offline, unlike the committed
          # changelogs that scripts/gen-changelog.sh produces. git-cliff's GitHub
          # integration is the only thing that populates commit.remote.username
          # and commit.remote.pr_number, and those are what turn a bare subject
          # line into "... by [@user] in [#472]". See #492.
          #
          # git-cliff aborts rather than degrading when that API is unavailable
          # (rate limit, revoked token, GitHub outage), and it puts no bound on
          # the call, so wrap it: a release must not fail or hang over missing
          # credit. The fallback is the offline render, i.e. exactly the
          # uncredited notes this repo produced before #492.
          render_notes() {
            local out
            if out=$(timeout 300 git cliff "$@"); then
              printf '%s\n' "$out"
              return 0
            fi
            echo "::warning::git-cliff could not reach the GitHub API; release notes will carry no author or PR attribution" >&2
            git cliff --offline "$@"
          }

          TAG="${GITHUB_REF_NAME}"          # e.g. cli/v0.2.0 or cli/v0.2.0-rc.1
          VERSION="${TAG#cli/}"
          # Asymmetric scoping (see #246): an RC shows the delta since the prior
          # tag; a stable release covers everything since the previous STABLE so
          # its notes are not truncated to the last-rc delta.
          if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            BODY=$(render_notes --include-path "operator/cmd/cli/**" \
              --tag-pattern "cli/.*" --latest --strip all)
          elif [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PREV=$(git tag -l 'cli/v*' --sort=-v:refname \
              | grep -E '^cli/v[0-9]+\.[0-9]+\.[0-9]+$' \
              | grep -v "^${TAG}$" | head -1)
            # When PREV is empty (first stable tag) fall back to ROOT..TAG.
            # A bare single ref emits nothing when the tag's own commit is
            # path-filtered out (same issue documented in gen-changelog.sh).
            if [[ -n "${PREV}" ]]; then
              RANGE="${PREV}..${TAG}"
            else
              ROOT=$(git rev-list --max-parents=0 HEAD | tail -1)
              RANGE="${ROOT}..${TAG}"
            fi
            BODY=$(render_notes --include-path "operator/cmd/cli/**" \
              --tag-pattern 'cli/v[0-9]+\.[0-9]+\.[0-9]+$' \
              --tag "${TAG}" "${RANGE}" --strip all)
          else
            echo "ERROR: tag '${TAG}' must match cli/v<MAJOR>.<MINOR>.<PATCH> or cli/v<MAJOR>.<MINOR>.<PATCH>-rc.<N>" >&2
            exit 1
          fi
          # Prepend the human-authored RELEASE_NOTES.md entry for this version, if any.
          # Match a heading that is exactly "## <tag>" or "## <tag> <suffix>".
          NOTES_FILE="operator/cmd/cli/RELEASE_NOTES.md"
          HUMAN=""
          if [[ -f "${NOTES_FILE}" ]]; then
            HUMAN=$(awk -v tag="${TAG}" '
              { h = "## " tag
                if (index($0, h) == 1) {
                  nc = substr($0, length(h) + 1, 1)
                  if (nc == "" || nc == " ") { f = 1; next }
                } }
              /^## / { if (f) f = 0 }
              f' "${NOTES_FILE}")
          fi
          {
            [ -n "${HUMAN}" ] && printf '%s\n\n' "${HUMAN}"
            printf '%s\n' "${BODY}"
          } > "${RUNNER_TEMP:-/tmp}/notes.md"
          # Use a random delimiter so a literal "EOF" line in release notes can't
          # truncate the multi-line output variable (GitHub Actions requirement).
          GH_DELIM="NOTES_EOF_$(openssl rand -hex 8)"
          { echo "notes<<${GH_DELIM}"; cat "${RUNNER_TEMP:-/tmp}/notes.md"; echo "${GH_DELIM}"; } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: "NodeWright CLI ${{ steps.version.outputs.version }}"
          prerelease: ${{ steps.version.outputs.prerelease }}
          files: |
            operator/dist/*.tar.gz
            operator/dist/*.zip
            operator/dist/checksums.txt
          body: |
            ## NodeWright CLI ${{ steps.version.outputs.version }}

            ${{ steps.release_notes.outputs.notes }}

            ### Installation

            Download and extract the appropriate archive for your platform.
            The binary must be named `kubectl-${{ steps.assets.outputs.binary }}` for kubectl to discover it as a plugin.
            Alternatively, it can be used directly as `${{ steps.assets.outputs.binary }}` without kubectl.

            ```bash
            # Linux (amd64)
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.assets.outputs.linux_amd64_archive }}
            tar -xzf ${{ steps.assets.outputs.linux_amd64_archive }}
            sudo mv ${{ steps.assets.outputs.binary }} /usr/local/bin/kubectl-${{ steps.assets.outputs.binary }}

            # macOS (Apple Silicon)
            curl -LO https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${{ steps.assets.outputs.darwin_arm64_archive }}
            tar -xzf ${{ steps.assets.outputs.darwin_arm64_archive }}
            sudo mv ${{ steps.assets.outputs.binary }} /usr/local/bin/kubectl-${{ steps.assets.outputs.binary }}
            ```

            ### Verify installation

            ```bash
            kubectl ${{ steps.assets.outputs.binary }} version --client-only
            # Or if installed as '${{ steps.assets.outputs.binary }}':
            ${{ steps.assets.outputs.binary }} version --client-only
            ```
