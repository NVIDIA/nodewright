# CodeQL static analysis for the Go sources (operator + CLI, agent, and tools).
# Runs weekly and on demand. Go uses manual build-mode with an explicit build of
# every module (CodeQL has no build-mode: none for Go).
#
# `tools` is built too, and is the one module here with no vendor directory: it
# has no third-party dependencies, which is what lets the release job run it
# with a toolchain and no module download. Leaving it out would exclude the code
# that writes the OpenVEX predicate cosign signs.

name: "CodeQL"

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: manual
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: operator/go.mod
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2  # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      # Manual build for Go: compile every module so CodeQL can trace the
      # build. operator and agent are vendored; tools is stdlib-only and has no
      # vendor directory, so it builds without the flag.
      - run: |
          set -euo pipefail
          (cd operator && GOFLAGS=-mod=vendor go build ./...)
          (cd agent && GOFLAGS=-mod=vendor go build ./...)
          (cd tools && go build ./...)
      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd  # v4.38.1
        with:
          category: "/language:${{ matrix.language }}"
