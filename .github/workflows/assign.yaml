# Lets contributors self-serve issue assignment by commenting on an issue:
#   /assign          -> claims the issue (commenter), only if unassigned
#   /assign @user    -> assigns the mentioned user, only if unassigned
#   /unassign        -> releases the issue, only if assigned to the commenter
#
# Single-owner model: /assign is refused when the issue already has an
# assignee (comment /unassign to release it first), and assigns exactly one
# user at a time. /unassign only ever removes the commenter and is refused
# when they are not currently assigned, so nobody can drop another's claim.
#
# Work-in-progress limit (CONTRIBUTING.md#work-in-progress-limit): /assign is
# refused when the target already has MAX_ASSIGNED_ISSUES open issues assigned
# in this repo. Issues whose type is in EXEMPT_ISSUE_TYPES (Epic, Initiative)
# neither count toward the limit nor are blocked by it, since their sub-issues
# are claimed and counted individually.
#
# Triage gate (CONTRIBUTING.md#claiming-an-issue): /assign is refused while the
# issue still carries TRIAGE_LABEL, so nobody claims work before a maintainer
# has confirmed it is wanted. triage.yaml adds the label and never removes it;
# a maintainer removing it is the triage decision. Because triage.yaml adds it
# in a separate run, an issue younger than TRIAGE_LABEL_WAIT_MINUTES that has
# never carried the label is also treated as untriaged. A commenter with write
# access or above is not blocked, since a maintainer claiming an issue is
# itself a triage decision, and the label is removed once that claim lands. The issue's author may always claim it for
# themselves (not for anyone else), so filing an issue and opening its pull
# request together still works; that claim is not triage, so the label stays.
#
# issue_comment always runs in the base-repo context with the base-repo
# token, so there is no fork/pwn-request exposure here: the job only needs
# `issues: write` and never checks out untrusted code. GitHub's addAssignees
# silently ignores users who are not assignable (only the commenter/self,
# prior commenters on the issue, users with write access, or org members
# with read access can be assigned); we detect and report those.

name: Self-Assign Issues

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  # Keep in step with the limit stated in CONTRIBUTING.md and .claude/CLAUDE.md.
  MAX_ASSIGNED_ISSUES: 3
  # Comma-separated issue type names that neither count toward the limit nor
  # are blocked by it.
  EXEMPT_ISSUE_TYPES: Epic,Initiative
  # Keep in step with triage.yaml and .github/labels.yml.
  TRIAGE_LABEL: needs-triage
  # How long after an issue opens a missing TRIAGE_LABEL is treated as not yet
  # added by triage.yaml rather than cleared. It normally lands within seconds;
  # the margin covers a backed-up Actions queue.
  TRIAGE_LABEL_WAIT_MINUTES: 60

jobs:

  assign:
    name: Handle /assign and /unassign
    # Issues only (not PRs); comment starts with /assign or /unassign.
    if: >-
      !github.event.issue.pull_request &&
      (startsWith(github.event.comment.body, '/assign') ||
       startsWith(github.event.comment.body, '/unassign'))
    # One repo-wide queue, not one per issue: the limit check and the
    # assignment must not interleave with an /assign on another issue, or two
    # concurrent claims could both pass the count. Job-level so only command
    # comments queue here, and queue: max because the default keeps a single
    # pending run and cancels the one it replaces, which would drop a command.
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    permissions:
      # Needed to update issue assignees and post status comments back.
      issues: write
    timeout-minutes: 5
    steps:

      - name: Apply assignment change
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const body = context.payload.comment.body.trim();
            const commenter = context.payload.comment.user.login;

            // Match the command exactly: the first whitespace-delimited token
            // must be /assign or /unassign. A plain startsWith would also fire
            // on /assign-anything and silently self-assign the commenter.
            const tokens = body.split(/\s+/);
            const command = tokens[0];
            if (command !== '/assign' && command !== '/unassign') {
              core.info(`Ignoring comment; not an assignment command: ${command}`);
              return;
            }
            const unassign = command === '/unassign';

            const common = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            };

            // Read assignees fresh rather than trusting context.payload: jobs
            // are serialized (cancel-in-progress: false), so a queued job may
            // run well after the webhook snapshot has gone stale.
            const { data: freshIssue } = await github.rest.issues.get(common);
            const current = (freshIssue.assignees || []).map(a => a.login);

            if (unassign) {
              // Self-only: a commenter may only release their own claim.
              if (!current.includes(commenter)) {
                core.info(`${commenter} is not assigned; nothing to unassign`);
                await github.rest.issues.createComment({
                  ...common,
                  body: `@${commenter} you are not currently assigned to this issue, so there is nothing to release.`,
                });
                return;
              }
              await github.rest.issues.removeAssignees({
                ...common,
                assignees: [commenter],
              });
              core.info(`Unassigned ${commenter}`);
              return;
            }

            // Assign only on an unassigned issue (single-owner model).
            if (current.length) {
              core.info(`Issue already assigned to ${current.join(', ')}; refusing`);
              await github.rest.issues.createComment({
                ...common,
                body: [
                  `This issue is already assigned to ${current.map(u => '@' + u).join(', ')}.`,
                  'The assignee can comment `/unassign` to release it first.',
                ].join('\n'),
              });
              return;
            }

            // Single-owner model: /assign takes an optional single @user as its
            // only argument. Parse the command's own tokens, not the whole body:
            // scanning for mentions would let "/assign\ncc @maintainer" assign
            // the wrong person. No argument self-claims the commenter; anything
            // other than one bare @user (extra text, multiple mentions) is
            // refused so a claim can never land on an unintended user.
            const args = tokens.slice(1);
            const userArg = /^@([a-zA-Z0-9](?:[a-zA-Z0-9-]{0,37}[a-zA-Z0-9])?)$/;
            let target;
            if (args.length === 0) {
              target = commenter;
            } else if (args.length === 1 && userArg.test(args[0])) {
              target = args[0].slice(1);
            } else {
              core.info(`Unrecognized /assign arguments; refusing: ${args.join(' ')}`);
              await github.rest.issues.createComment({
                ...common,
                body: 'This issue uses a single-owner model. Comment `/assign` to claim it yourself, or `/assign @user` to assign one other person.',
              });
              return;
            }
            const targets = [target];

            const triageLabel = process.env.TRIAGE_LABEL;
            let untriaged = (freshIssue.labels || []).some(l => l.name === triageLabel);
            // triage.yaml adds the label in its own run, some seconds after the
            // issue opens, and nothing orders it before this one. On a new issue
            // an absent label may only mean "not added yet", so it counts as
            // triaged only when the label's latest event is its removal. The
            // events are the single source here: the label may have landed
            // since freshIssue was read.
            const ageMinutes = (Date.now() - Date.parse(freshIssue.created_at)) / 60000;
            if (!untriaged && ageMinutes < Number(process.env.TRIAGE_LABEL_WAIT_MINUTES)) {
              const events = await github.paginate(github.rest.issues.listEvents, common);
              const labelEvents = events.filter(e =>
                ['labeled', 'unlabeled'].includes(e.event) && e.label?.name === triageLabel);
              untriaged = labelEvents.at(-1)?.event !== 'unlabeled';
            }
            let triagedByClaim = false;
            if (untriaged) {
              // The endpoint answers 200 (read or none) for any existing user,
              // so a 404 means the login is gone, e.g. renamed while this run
              // sat in the queue. Treat it as no access rather than failing.
              let permission = 'none';
              try {
                ({ data: { permission } } = await github.rest.repos.getCollaboratorPermissionLevel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  username: commenter,
                }));
              } catch (err) {
                if (err.status !== 404) throw err;
              }
              const selfClaim = target.toLowerCase() === commenter.toLowerCase();
              const isAuthor = freshIssue.user?.login.toLowerCase() === commenter.toLowerCase();
              // permission is the legacy summary: maintain reports as write,
              // triage as read.
              if (['admin', 'write'].includes(permission)) {
                core.info(`${commenter} has ${permission} access; claiming past ${triageLabel}`);
                triagedByClaim = true;
              } else if (selfClaim && isAuthor) {
                core.info(`${commenter} opened this issue; self-claim allowed, ${triageLabel} stays`);
              } else {
                core.info(`Issue is untriaged and ${commenter} has ${permission} access; refusing`);
                await github.rest.issues.createComment({
                  ...common,
                  body: [
                    'This issue has not been triaged yet, so it cannot be claimed.',
                    '',
                    `A maintainer will confirm the work is wanted and remove the \`${triageLabel}\` label; comment \`/assign\` again after that. ` +
                      'The person who opened an issue can always claim it for themselves. ' +
                      `See [CONTRIBUTING.md](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/HEAD/CONTRIBUTING.md#claiming-an-issue).`,
                  ].join('\n'),
                });
                return;
              }
            }

            const exemptTypes = (process.env.EXEMPT_ISSUE_TYPES || '')
              .split(',')
              .map(t => t.trim())
              .filter(Boolean);
            if (!exemptTypes.includes(freshIssue.type?.name)) {
              const rawLimit = (process.env.MAX_ASSIGNED_ISSUES || '').trim();
              const limit = Number(rawLimit);
              if (!/^[1-9][0-9]*$/.test(rawLimit) || !Number.isSafeInteger(limit)) {
                core.setFailed(`MAX_ASSIGNED_ISSUES must be a positive integer, got: ${process.env.MAX_ASSIGNED_ISSUES}`);
                return;
              }
              // The assignee filter answers 422 for an unknown login and reads
              // the literal "none" as "unassigned". 422 also covers other
              // failures, so skip the count only once a user lookup confirms the
              // login does not exist: addAssignees below already reports a user
              // it cannot assign. Any other failure aborts rather than count zero.
              // Matching each item's assignees against the target
              // (case-insensitively, like the filter) neutralizes "none".
              // listForRepo returns pull requests too; only issues count.
              let open = [];
              try {
                open = await github.paginate(github.rest.issues.listForRepo, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  assignee: target,
                  state: 'open',
                  per_page: 100,
                });
              } catch (err) {
                if (err.status !== 422) throw err;
                const userExists = await github.rest.users.getByUsername({ username: target })
                  .then(() => true, lookupErr => {
                    if (lookupErr.status !== 404) throw lookupErr;
                    return false;
                  });
                if (userExists) throw err;
                core.info(`${target} is not a GitHub user; skipping the limit check`);
              }
              const targetLower = target.toLowerCase();
              const assigned = open.filter(i =>
                !i.pull_request &&
                !exemptTypes.includes(i.type?.name) &&
                (i.assignees || []).some(a => a.login.toLowerCase() === targetLower));
              if (assigned.length >= limit) {
                core.info(`${target} has ${assigned.length} assigned issues (limit ${limit}); refusing`);
                await github.rest.issues.createComment({
                  ...common,
                  body: [
                    `@${target} already has ${assigned.length} open issues assigned in this repository, and the work-in-progress limit is ${limit}:`,
                    '',
                    ...assigned.map(i => `- #${i.number}`),
                    '',
                    'Get one of them merged or closed, or comment `/unassign` on one to release it, then try again. ' +
                      (exemptTypes.length ? `Issues typed ${exemptTypes.join(' or ')} do not count. ` : '') +
                      `See [CONTRIBUTING.md](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/HEAD/CONTRIBUTING.md#work-in-progress-limit).`,
                  ].join('\n'),
                });
                return;
              }
            }

            const { data: issue } = await github.rest.issues.addAssignees({
              ...common,
              assignees: targets,
            });

            // GitHub drops non-assignable users without erroring, so surface them.
            // Logins are case-insensitive, and the response carries the
            // canonical casing, which may differ from what was typed.
            const got = new Set(issue.assignees.map(a => a.login.toLowerCase()));
            const skipped = targets.filter(u => !got.has(u.toLowerCase()));
            if (skipped.length) {
              core.warning(`Could not assign: ${skipped.join(', ')}`);
              await github.rest.issues.createComment({
                ...common,
                body: [
                  `Could not assign ${skipped.map(u => '@' + u).join(', ')}.`,
                  '',
                  'GitHub only lets you assign the commenter/self, someone who has',
                  'commented on this issue, a user with write access, or an org',
                  'member with read access.',
                ].join('\n'),
              });
            }

            // A maintainer's claim past the gate is the triage decision, so it
            // clears the label, but only once the assignment has landed: a
            // claim refused above must leave the issue untriaged.
            if (triagedByClaim && !skipped.length) {
              try {
                await github.rest.issues.removeLabel({ ...common, name: triageLabel });
                core.info(`Removed ${triageLabel}; the claim by ${commenter} triaged the issue`);
              } catch (err) {
                if (err.status !== 404) throw err;
              }
            }
