name: Create GitHub Release

# Triggered on tag pushes for operator, agent, and chart components.
# CLI releases are handled separately by cli-release.yaml (which also builds binaries).
#
# Tags follow the pattern <component>/v<version> (e.g. operator/v0.14.0).
# Release notes are generated by git-cliff scoped to the tagged component, with
# author and PR attribution resolved through the GitHub API. Note that
# `scripts/gen-changelog.sh <component>` previews the committed-changelog
# rendering, which is deliberately uncredited -- see the "Attribution" table in
# docs/contributing/release-process.md.

on:
  push:
    tags:
      - 'operator/**'
      - 'agent/**'
      - 'chart/**'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # git-cliff resolves each commit's author and PR number through the
      # GitHub API; listing pull requests needs this scope, and declaring
      # `contents` above would otherwise narrow GITHUB_TOKEN to just that.
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract component name from tag
        id: extract
        run: |
          COMPONENT=$(echo "${{ github.ref_name }}" | cut -f 1 -d /)
          echo "component=${COMPONENT}" >> $GITHUB_OUTPUT

      - name: Install git-cliff
        run: |
          GC_VERSION=$(curl -sSf --retry 3 --retry-delay 5 --retry-all-errors https://api.github.com/repos/orhun/git-cliff/releases/latest | grep '"tag_name"' | cut -d '"' -f 4)
          # Download to a file rather than piping into tar: a retried transfer
          # restarts from byte 0, which would replay bytes into a tar already
          # part-way through the stream.
          curl -sSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o /tmp/git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/${GC_VERSION}/git-cliff-${GC_VERSION#v}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/git-cliff.tar.gz --wildcards --strip-components=1 "*/git-cliff"
          sudo mv git-cliff /usr/local/bin/

      - name: Generate release notes
        id: release_notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Release notes are rendered WITHOUT --offline, unlike the committed
          # changelogs that scripts/gen-changelog.sh produces. git-cliff's GitHub
          # integration is the only thing that populates commit.remote.username
          # and commit.remote.pr_number, and those are what turn a bare subject
          # line into "... by [@user] in [#472]". See #492.
          #
          # git-cliff aborts rather than degrading when that API is unavailable
          # (rate limit, revoked token, GitHub outage), and it puts no bound on
          # the call, so wrap it: a release must not fail or hang over missing
          # credit. The fallback is the offline render, i.e. exactly the
          # uncredited notes this repo produced before #492.
          render_notes() {
            local out
            if out=$(timeout 300 git cliff "$@"); then
              printf '%s\n' "$out"
              return 0
            fi
            echo "::warning::git-cliff could not reach the GitHub API; release notes will carry no author or PR attribution" >&2
            git cliff --offline "$@"
          }

          COMPONENT="${{ steps.extract.outputs.component }}"
          TAG="${GITHUB_REF_NAME}"          # e.g. operator/v0.16.0 or operator/v0.16.0-rc.1
          VERSION="${TAG#*/}"
          INCLUDE_PATH="${COMPONENT}/**"
          # CLI code lives under operator/cmd/cli/ but is handled by cli-release.yaml.
          #
          # Asymmetric scoping (see #246): an RC shows just the delta since the
          # previous tag (rc or stable), useful while iterating. A stable release
          # covers everything since the previous STABLE -- rc tags are excluded as
          # boundaries so stable notes are not truncated to the last-rc delta.
          if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            BODY=$(render_notes --include-path "${INCLUDE_PATH}" \
              --tag-pattern "${COMPONENT}/.*" --latest --strip all)
          elif [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PREV=$(git tag -l "${COMPONENT}/v*" --sort=-v:refname \
              | grep -E "^${COMPONENT}/v[0-9]+\.[0-9]+\.[0-9]+$" \
              | grep -v "^${TAG}$" | head -1)
            # When PREV is empty (first stable tag) fall back to ROOT..TAG.
            # A bare single ref emits nothing when the tag's own commit is
            # path-filtered out (same issue documented in gen-changelog.sh).
            if [[ -n "${PREV}" ]]; then
              RANGE="${PREV}..${TAG}"
            else
              ROOT=$(git rev-list --max-parents=0 HEAD | tail -1)
              RANGE="${ROOT}..${TAG}"
            fi
            BODY=$(render_notes --include-path "${INCLUDE_PATH}" \
              --tag-pattern "${COMPONENT}/v[0-9]+\.[0-9]+\.[0-9]+$" \
              --tag "${TAG}" "${RANGE}" --strip all)
          else
            echo "ERROR: tag '${TAG}' must match <component>/v<MAJOR>.<MINOR>.<PATCH> or <component>/v<MAJOR>.<MINOR>.<PATCH>-rc.<N>" >&2
            exit 1
          fi
          # Prepend the human-authored RELEASE_NOTES.md entry for this version, if any.
          # Match a heading that is exactly "## <tag>" or "## <tag> <suffix>".
          NOTES_FILE="${COMPONENT}/RELEASE_NOTES.md"
          HUMAN=""
          if [[ -f "${NOTES_FILE}" ]]; then
            HUMAN=$(awk -v tag="${TAG}" '
              { h = "## " tag
                if (index($0, h) == 1) {
                  nc = substr($0, length(h) + 1, 1)
                  if (nc == "" || nc == " ") { f = 1; next }
                } }
              /^## / { if (f) f = 0 }
              f' "${NOTES_FILE}")
          fi
          {
            [ -n "${HUMAN}" ] && printf '%s\n\n' "${HUMAN}"
            printf '%s\n' "${BODY}"
          } > "${RUNNER_TEMP:-/tmp}/notes.md"
          # Use a random delimiter so a literal "EOF" line in release notes can't
          # truncate the multi-line output variable (GitHub Actions requirement).
          GH_DELIM="NOTES_EOF_$(openssl rand -hex 8)"
          { echo "notes<<${GH_DELIM}"; cat "${RUNNER_TEMP:-/tmp}/notes.md"; echo "${GH_DELIM}"; } >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          # Pinned to match agent-ci.yaml PYTHON_VERSION so notices generation
          # uses the same interpreter as the agent build.
          python-version: '3.13'

      - name: Install go-licenses
        run: make -C operator go-licenses

      - name: Regenerate third-party notices
        run: make notices

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Idempotent: skip create if the release already exists so workflow
        # re-runs on the same tag can still reach the upload step below.
        run: |
          PRERELEASE_FLAG=""
          # Release candidate tags (e.g. operator/v0.16.0-rc.1) → mark as
          # prerelease so they don't become "Latest" on the Releases page.
          # Only -rc.<N> is accepted; the dot makes version sort order RCs
          # correctly. Any other suffix is rejected to keep the format predictable.
          VERSION="${GITHUB_REF_NAME#*/}"
          if [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            : # plain release
          elif [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[0-9]+$ ]]; then
            PRERELEASE_FLAG="--prerelease"
          else
            echo "ERROR: tag '${GITHUB_REF_NAME}' does not match v<MAJOR>.<MINOR>.<PATCH> or v<MAJOR>.<MINOR>.<PATCH>-rc.<N>" >&2
            exit 1
          fi
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release create "${{ github.ref_name }}" \
              --title "${{ github.ref_name }}" \
              --notes "${{ steps.release_notes.outputs.notes }}" \
              ${PRERELEASE_FLAG}
          fi

      - name: Upload third-party notices to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMPONENT="${{ steps.extract.outputs.component }}"
          case "${COMPONENT}" in
            operator) NOTICES_FILE="operator/THIRD_PARTY_NOTICES.md" ;;
            agent)    NOTICES_FILE="agent/THIRD_PARTY_NOTICES.md" ;;
            chart)    NOTICES_FILE="THIRD_PARTY_NOTICES.md" ;;
            *)
              echo "ERROR: unknown component '${COMPONENT}' — no notices file mapping." >&2
              exit 1
              ;;
          esac
          gh release upload "${{ github.ref_name }}" "${NOTICES_FILE}" --clobber

  publish-chart:
    if: startsWith(github.ref_name, 'chart/')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      - name: Verify chart version matches tag
        id: chart-metadata
        run: |
          CHART_NAME=$(yq '.name' chart/Chart.yaml)
          TAG_VERSION="${GITHUB_REF_NAME#chart/}"
          CHART_VERSION=$(yq '.version' chart/Chart.yaml)
          if [ "${TAG_VERSION}" != "${CHART_VERSION}" ]; then
            echo "Tag version ${TAG_VERSION} does not match chart/Chart.yaml version ${CHART_VERSION}" >&2
            exit 1
          fi
          echo "name=${CHART_NAME}" >> "${GITHUB_OUTPUT}"
          echo "version=${CHART_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Package chart
        run: |
          mkdir -p dist
          helm package chart/ --destination dist/

      - name: Log in to ghcr.io
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io --username "${{ github.actor }}" --password-stdin

      # cosign reads ~/.docker/config.json; helm registry login writes its own
      # config so cosign can't see those creds. Authenticate docker too so the
      # downstream sign/attest steps can upload the .sig and SBOM layers.
      - name: Log in to ghcr.io (docker, for cosign)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push chart to ghcr.io
        id: push-chart
        env:
          CHART_NAME: ${{ steps.chart-metadata.outputs.name }}
          CHART_VERSION: ${{ steps.chart-metadata.outputs.version }}
          IMAGE_NAME: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Lowercase for Docker compliance
          chart_repo="ghcr.io/$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')/charts"
          chart_subject="${chart_repo}/${CHART_NAME}"
          # `helm push` writes "Pushed:" and "Digest:" to stderr (helm 3.16+),
          # so capture both streams or awk sees an empty string.
          push_output="$(helm push "dist/${CHART_NAME}-${CHART_VERSION}.tgz" "oci://${chart_repo}" 2>&1)"
          printf '%s\n' "${push_output}"
          chart_digest="$(awk '/^Digest:/ {print $2}' <<< "${push_output}")"
          if ! [[ "${chart_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "::error::failed to parse Helm chart digest from helm push output"
            exit 1
          fi

          echo "subject-name=${chart_subject}" >> "${GITHUB_OUTPUT}"
          echo "digest=${chart_digest}" >> "${GITHUB_OUTPUT}"

      - name: Sign GHCR Helm chart and attach SBOM
        uses: ./.github/actions/cosign-sign-sbom
        with:
          subject-name: ${{ steps.push-chart.outputs.subject-name }}
          subject-digest: ${{ steps.push-chart.outputs.digest }}
          sbom-source: chart

      - name: Attest GHCR Helm chart provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.push-chart.outputs.subject-name }}
          subject-digest: ${{ steps.push-chart.outputs.digest }}
          push-to-registry: true

      - name: Verify GHCR Helm chart signature and attestations
        uses: ./.github/actions/cosign-verify-release
        with:
          subject-name: ${{ steps.push-chart.outputs.subject-name }}
          subject-digest: ${{ steps.push-chart.outputs.digest }}
          certificate-identity-regexp: ^https://github.com/${{ github.repository }}/\.github/workflows/release\.yml@refs/tags/chart/.*$
