name: Merge Gate

# Checks that block merges: dependency licenses and Renovate configuration.
# Modeled on NVIDIA/aicr's merge-gate.yaml.

on:
  pull_request:
    branches: [main, 'release/**']

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Path filtering — only run downstream jobs when relevant files change.
  # ---------------------------------------------------------------------------
  check-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    outputs:
      deps: ${{ steps.filter.outputs.deps }}
      renovate: ${{ steps.filter.outputs.renovate }}
      notices: ${{ steps.filter.outputs.notices }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            deps:
              - 'operator/go.mod'
              - 'operator/go.sum'
              - 'operator/vendor/**'
              - 'agent/go/go.mod'
              - 'agent/go/go.sum'
            renovate:
              - '.github/dependabot.yml'
              - '.github/renovate.json5'
              - '.github/workflows/renovate.yaml'
              - 'Makefile'
            notices:
              - 'operator/go.mod'
              - 'operator/go.sum'
              - 'operator/vendor/**'
              - 'operator/deps.mk'
              - 'operator/Makefile'
              - 'agent/vendor/**'
              - 'agent/skyhook-agent/pyproject.toml'
              - 'agent/go/go.mod'
              - 'agent/go/go.sum'
              - 'agent/go/deps.mk'
              - 'agent/go/Makefile'
              - 'agent/go/LICENSE'
              - 'scripts/generate-notices.py'
              - 'scripts/generate-notices_test.py'
              - 'Makefile'
              - '.github/workflows/merge-gate.yaml'
              - 'THIRD_PARTY_NOTICES.md'
              - 'operator/THIRD_PARTY_NOTICES.md'
              - 'agent/THIRD_PARTY_NOTICES.md'

  validate-renovate:
    needs: [check-paths]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        if: needs.check-paths.outputs.renovate == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate Renovate configuration
        if: needs.check-paths.outputs.renovate == 'true'
        run: make renovate-config-check
      - name: Skip Renovate validation
        if: needs.check-paths.outputs.renovate != 'true'
        run: echo "No dependency automation changes — Renovate validation not required"

  verify-licenses:
    needs: [check-paths]
    if: needs.check-paths.outputs.deps == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache: false
      - name: Install go-licenses (operator)
        run: make -C operator go-licenses
      - name: Report licenses (operator)
        env:
          GOFLAGS: -mod=vendor
        working-directory: operator
        run: |
          echo "=== Dependency Licenses ==="
          ./bin/go-licenses report ./... 2>/dev/null | sort -t',' -k3 | column -t -s','
          echo ""
          echo "=== License Summary ==="
          ./bin/go-licenses report ./... 2>/dev/null | cut -d',' -f3 | sort | uniq -c | sort -rn
      - name: Check licenses (operator)
        env:
          GOFLAGS: -mod=vendor
        run: make -C operator license-check
      - uses: actions/setup-go@v7
        with:
          go-version-file: agent/go/go.mod
          cache: false
      - name: Install go-licenses (agent/go)
        run: make -C agent/go go-licenses
      - name: Report licenses (agent/go)
        working-directory: agent/go
        run: |
          echo "=== Dependency Licenses ==="
          ./bin/go-licenses report ./... 2>/dev/null | sort -t',' -k3 | column -t -s','
          echo ""
          echo "=== License Summary ==="
          ./bin/go-licenses report ./... 2>/dev/null | cut -d',' -f3 | sort | uniq -c | sort -rn
      - name: Check licenses (agent/go)
        run: make -C agent/go license-check

  verify-notices:
    needs: [check-paths]
    if: needs.check-paths.outputs.notices == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Test the license completeness gate
        run: make notices-test
      - name: Verify notices are up to date
        run: make notices-check

  verify-notices-skip:
    needs: [check-paths]
    if: needs.check-paths.outputs.notices != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "No dependency or notices changes; notices verification not required"

  verify-licenses-skip:
    needs: [check-paths]
    if: needs.check-paths.outputs.deps != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - run: echo "No dependency changes — license check not required"

  ci-gate:
    name: ci-gate
    needs: [validate-renovate, verify-licenses, verify-licenses-skip, verify-notices, verify-notices-skip]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          echo "$results" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")'
