name: Agent CI
on:
  pull_request:
    branches:
      - main
    paths:
      - agent/**
      - containers/agent.Dockerfile
      - k8s-tests/operator-agent/**
      - .github/actions/**
      - operator/versions.yaml
      - operator/versions.sh
      - scripts/latest-distroless.sh
      - .github/workflows/agent-ci.yaml
  push:
    branches:
      - main
    tags:
      - agent/*
    paths:
      - agent/**
      - containers/agent.Dockerfile
      - k8s-tests/operator-agent/**
      - .github/actions/**
      - operator/versions.yaml
      - operator/versions.sh
      - scripts/latest-distroless.sh
      - .github/workflows/agent-ci.yaml

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DEBIAN_VERSION: trixie
  PUSH_TO_REGISTRY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  # Opt all JS actions into Node 24 ahead of GitHub's Node 20 phase-out.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  fetch-distroless-versions:
    name: Resolve Distroless Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      distroless-version: ${{ steps.fetch.outputs.distroless-version }}
      distroless-digest: ${{ steps.fetch.outputs.distroless-digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-oras
      - name: Resolve newest published distroless/static
        id: fetch
        run: |
          ./scripts/latest-distroless.sh \
            --repo nvcr.io/nvidia/distroless/static \
            --major 4 \
            --print | tee -a "$GITHUB_OUTPUT"

  compute-metadata:
    name: Compute Image Metadata
    runs-on: ubuntu-latest
    outputs:
      git-sha: ${{ steps.meta.outputs.git-sha }}
      agent-version: ${{ steps.meta.outputs.agent-version }}
      agent-image-tag: ${{ steps.meta.outputs.agent-image-tag }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch all tags
        run: git fetch --tags --force
      - name: Compute metadata
        id: meta
        run: |
          GIT_SHA=$(git rev-parse --short ${{ github.sha }})
          echo "git-sha=${GIT_SHA}" >> "$GITHUB_OUTPUT"

          case ${{ github.ref_type }} in
            branch)
              # The last release tag plus the current git sha
              AGENT_VERSION=$(git tag --list 'agent/*' --sort=-v:refname | head -n 1 | cut -d/ -f2)+${GIT_SHA}
              # Convert + to - for docker tag compliance
              AGENT_IMAGE_TAG=$(echo "${AGENT_VERSION}" | tr + -)
              TAGS="${GIT_SHA} ${AGENT_IMAGE_TAG}"
              ;;
            tag)
              # The version part of the tag
              AGENT_VERSION=$(echo "${{ github.ref_name }}" | cut -f 2 -d /)
              AGENT_IMAGE_TAG="${AGENT_VERSION}"
              TAGS="${GIT_SHA} ${AGENT_VERSION} latest"
              ;;
            *)
              echo "Unknown ref type ${{ github.ref_type }}"
              exit 1
              ;;
          esac

          echo "agent-version=${AGENT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "agent-image-tag=${AGENT_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "📦 Agent Version: ${AGENT_VERSION}"
          echo "🏷️  Image Tag: ${AGENT_IMAGE_TAG}"
          echo "🏷️  All Tags: ${TAGS}"

  test:
    name: Agent Unit Tests
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest
    steps:
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends ca-certificates make
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Run tests with coverage
        working-directory: agent
        run: CGO_ENABLED=0 make test
      - name: Upload coverage artifact
        if: hashFiles('agent/reporting/cover.out') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-agent-unit-tests
          path: agent/reporting/cover.out
          retention-days: 1
          if-no-files-found: ignore

  lint:
    name: Agent Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum
      - name: Check license headers
        working-directory: agent
        run: make license-header-check
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1 ## need to make this auto match 
          working-directory: agent

  build-agent:
    name: Build Agent (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    needs: [test, lint, compute-metadata, fetch-distroless-versions]
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
      - name: Build and smoke-test the agent container image
        env:
          GIT_SHA: ${{ needs.compute-metadata.outputs.git-sha }}
          AGENT_VERSION: ${{ needs.compute-metadata.outputs.agent-version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd agent
          GO_VERSION=$(awk '/^go /{go=$2} /^toolchain /{tc=$2; sub(/^go/,"",tc)} END{print (tc!=""?tc:go)}' go.mod)
          IMAGE="nodewright-agent:${GIT_SHA}"

          set -x
          # Built with --load rather than pushed directly: the --version smoke
          # test below needs the image present locally, and buildx rejects --load
          # together with --push. The platform tags are pushed afterwards.
          docker buildx build \
            --build-arg GIT_SHA=${GIT_SHA} \
            --build-arg AGENT_VERSION=${AGENT_VERSION} \
            --build-arg GO_VERSION="${GO_VERSION}" \
            --build-arg DEBIAN_VERSION=${{ env.DEBIAN_VERSION }} \
            --build-arg DISTROLESS_VERSION=${{ needs.fetch-distroless-versions.outputs.distroless-version }} \
            --build-arg DISTROLESS_DIGEST_SUFFIX="@${{ needs.fetch-distroless-versions.outputs.distroless-digest }}" \
            --load \
            --platform "$PLATFORM" \
            --provenance=false \
            --tag "$IMAGE" \
            -f ../containers/agent.Dockerfile .

          VERSION_OUTPUT=$(docker run --rm --platform "$PLATFORM" "$IMAGE" --version)
          if [ "$VERSION_OUTPUT" != "$AGENT_VERSION" ]; then
            echo "Expected agent version ${AGENT_VERSION}, got ${VERSION_OUTPUT}"
            exit 1
          fi

      - name: Push platform tags
        env:
          GIT_SHA: ${{ needs.compute-metadata.outputs.git-sha }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          if [ "${PUSH_TO_REGISTRY}" != "true" ]; then
            echo "Fork PR build: image built and smoke-tested without pushing to registry"
            exit 0
          fi

          PLATFORM_TAG=$(echo "$PLATFORM" | tr '/' '-')
          IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY=$(echo "${{ env.REGISTRY }}" | tr '[:upper:]' '[:lower:]')

          set -x
          for TAG in ${{ needs.compute-metadata.outputs.tags }}; do
            FULL_TAG="${REGISTRY}/${IMAGE_NAME}/agent:${TAG}-${PLATFORM_TAG}"
            docker tag "nodewright-agent:${GIT_SHA}" "${FULL_TAG}"
            docker push "${FULL_TAG}"
          done

  # Create multi-platform manifest from individual architecture builds
  create-manifest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Create Agent Manifest
    runs-on: ubuntu-latest
    needs: [compute-metadata, build-agent]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Create manifests
        id: manifest
        run: |
          IMAGE_NAME=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          REGISTRY=$(echo "${{ env.REGISTRY }}" | tr '[:upper:]' '[:lower:]')

          for TAG in ${{ needs.compute-metadata.outputs.tags }}; do
            FULL_TAG="${REGISTRY}/${IMAGE_NAME}/agent:${TAG}"
            echo "📦 Creating manifest for $FULL_TAG"
            docker manifest create $FULL_TAG \
              ${FULL_TAG}-linux-amd64 \
              ${FULL_TAG}-linux-arm64
            docker manifest push $FULL_TAG
            echo "✅ Pushed $FULL_TAG"
          done

          echo "subject-name=${REGISTRY}/${IMAGE_NAME}/agent" >> "$GITHUB_OUTPUT"
          # Platform-specific tags (e.g. v7.0.0-linux-amd64) are left in the
          # registry as intermediate artifacts; users pull the manifest tags.
          echo "✅ Multi-platform manifests created successfully"

      - name: Resolve multi-platform manifest digest
        id: digest
        uses: ./.github/actions/resolve-oci-digest
        with:
          image: ${{ steps.manifest.outputs.subject-name }}
          tag: ${{ needs.compute-metadata.outputs.git-sha }}

      - name: Sign GHCR agent image and attach SBOM
        if: env.PUSH_TO_REGISTRY == 'true' && startsWith(github.ref, 'refs/tags/agent/')
        uses: ./.github/actions/cosign-sign-sbom
        with:
          subject-name: ${{ steps.manifest.outputs.subject-name }}
          subject-digest: ${{ steps.digest.outputs.digest }}

      - name: Attest GHCR agent provenance
        if: env.PUSH_TO_REGISTRY == 'true' && startsWith(github.ref, 'refs/tags/agent/')
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.manifest.outputs.subject-name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Verify GHCR agent signature and attestations
        if: env.PUSH_TO_REGISTRY == 'true' && startsWith(github.ref, 'refs/tags/agent/')
        uses: ./.github/actions/cosign-verify-release
        with:
          subject-name: ${{ steps.manifest.outputs.subject-name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          certificate-identity-regexp: ^https://github.com/${{ github.repository }}/\.github/workflows/agent-ci\.yaml@refs/tags/agent/.*$

  # The operator-side contract suite (k8s-tests/operator-agent/) against the
  # image this run just built. operator-ci.yaml runs the same scenarios against
  # the released agent pinned in chart/values.yaml; the scenarios are shared,
  # never forked.
  operator-agent-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Operator Agent Integration Tests
    runs-on: ubuntu-latest
    needs: [compute-metadata, create-manifest]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-tags: true
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Kubernetes test versions
        id: k8s-versions
        run: |
          cd operator
          make yq
          YQ="$PWD/bin/yq" ./versions.sh --print >> "$GITHUB_OUTPUT"

      - name: Validate KinD node image
        env:
          K8S_VERSION: ${{ steps.k8s-versions.outputs.kind-nodeimage }}
        run: |
          cd operator
          make validate-kind-node-image KIND_NODE_IMAGE_VERSION="$K8S_VERSION"

      - name: Create Kubernetes KinD Cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2  # v1.15.0
        with:
          version: ${{ steps.k8s-versions.outputs.kind-binary }}
          node_image: kindest/node:v${{ steps.k8s-versions.outputs.kind-nodeimage }}
          config: operator/config/local-dev/kind-config.yaml
          cluster_name: kind

      - name: Restore cached Binaries
        id: cached-binaries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-bin-${{ hashFiles('operator/go.mod', 'operator/deps.mk', 'operator/versions.yaml', 'operator/versions.sh') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bin-
          path: |
            ${{ github.workspace }}/operator/bin
            ~/.cache/go-build

      - name: Install dependencies
        if: steps.cached-binaries.outputs.cache-hit != 'true'
        run: |
          cd operator
          make install-deps

      - name: Save cached Binaries
        if: steps.cached-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-bin-${{ hashFiles('operator/go.mod', 'operator/deps.mk', 'operator/versions.yaml', 'operator/versions.sh') }}
          path: |
            ${{ github.workspace }}/operator/bin
            ~/.cache/go-build

      - name: Run operator-agent tests
        env:
          AGENT_IMAGE: ${{ format('{0}/{1}/agent:{2}', env.REGISTRY, github.repository, needs.compute-metadata.outputs.agent-image-tag) }}
        run: |
          cd operator
          export AGENT_IMAGE="${AGENT_IMAGE,,}"
          echo "Testing with agent image: ${AGENT_IMAGE}"
          make build-cli
          make setup-kind-cluster operator-agent-tests

      - name: Dump diagnostics on failure
        if: failure()
        uses: ./.github/actions/dump-operator-agent-diagnostics

  # See operator-ci.yaml's ci-gate for the "skipped == green" rationale, but note
  # this gate cannot use the usual shape. The sibling gates exclude conditionally
  # skipped jobs from needs:, which is safe when those jobs are incidental --
  # here operator-agent-tests is the whole point of the workflow, and a job
  # absent from needs: cannot fail the gate at all. Both registry-dependent jobs
  # are therefore included and split out below: required to succeed when they can
  # run, required to be skipped when they cannot, so neither a real failure nor a
  # silently-missing run reads as green.
  ci-gate:
    name: ci-gate
    needs:
      - fetch-distroless-versions
      - compute-metadata
      - test
      - lint
      - build-agent
      - create-manifest
      - operator-agent-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        env:
          # Passed through the environment rather than interpolated into the jq
          # program: a needs result is a fixed enum, but keeping the payload out
          # of the script text avoids building a program from workflow context.
          # PUSH_TO_REGISTRY is already a workflow-level env var.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$RESULTS"

          # Jobs with no `if:` run on every event, including fork PRs.
          echo "$RESULTS" | jq -e '
            to_entries
            | map(select(.key != "create-manifest" and .key != "operator-agent-tests"))
            | all(.value.result == "success")'

          # create-manifest and operator-agent-tests need GHCR write, so they
          # skip on fork PRs. Asserting the expected state in both directions
          # keeps a skip from hiding a run that should have happened.
          if [ "$PUSH_TO_REGISTRY" = "true" ]; then
            echo "$RESULTS" | jq -e '
              to_entries
              | map(select(.key == "create-manifest" or .key == "operator-agent-tests"))
              | all(.value.result == "success")'
          else
            echo "$RESULTS" | jq -e '
              to_entries
              | map(select(.key == "create-manifest" or .key == "operator-agent-tests"))
              | all(.value.result == "skipped")'
          fi
