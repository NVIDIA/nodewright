name: Agent CI
on:
  pull_request:
    branches:
      - main
    paths:
      - agent/**
      - '!agent/go/**'
      - k8s-tests/operator-agent/**
      - containers/agent.Dockerfile
      - .github/actions/**
      - operator/versions.yaml
      - operator/versions.sh
      - scripts/latest-distroless.sh
      - .github/workflows/agent-ci.yaml
  push:
    branches:
      - main
    tags:
      - agent/*
    paths:
      - agent/**
      - '!agent/go/**'
      - k8s-tests/operator-agent/**
      - containers/agent.Dockerfile
      - .github/actions/**
      - operator/versions.yaml
      - operator/versions.sh
      - scripts/latest-distroless.sh
      - .github/workflows/agent-ci.yaml
env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PYTHON_VERSION: 3.13
  DEBIAN_VERSION: trixie
  PUSH_TO_REGISTRY: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
  # Opt all JS actions into Node 24 ahead of GitHub's Node 20 phase-out.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  fetch-distroless-versions:
    name: Resolve Distroless Base Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      distroless-version: ${{ steps.fetch.outputs.distroless-version }}
      distroless-digest: ${{ steps.fetch.outputs.distroless-digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-oras
      - name: Resolve newest published distroless/python
        id: fetch
        run: |
          # distroless/python tags carry the interpreter version, e.g. 3.13-v4.0.8.
          ./scripts/latest-distroless.sh \
            --repo nvcr.io/nvidia/distroless/python \
            --major 4 \
            --tag-prefix "${PYTHON_VERSION}-" \
            --print | tee -a "$GITHUB_OUTPUT"
  
  compute-metadata:
    name: Compute Image Metadata
    runs-on: ubuntu-latest
    outputs:
      git-sha: ${{ steps.meta.outputs.git-sha }}
      agent-version: ${{ steps.meta.outputs.agent-version }}
      agent-image-tag: ${{ steps.meta.outputs.agent-image-tag }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Fetch all tags
        run: git fetch --tags --force
      - name: Compute metadata
        id: meta
        run: |
          export GIT_SHA=$(git rev-parse --short ${{ github.sha }})
          echo "git-sha=${GIT_SHA}" >> $GITHUB_OUTPUT
          
          case ${{ github.ref_type }} in
            branch)
                # The last tag + current git sha
                export AGENT_VERSION=$(git tag --list 'agent*' --sort=-v:refname | head -n 1 | cut -d/ -f2)+${GIT_SHA}
                # Convert + to - for docker tag compliance
                export AGENT_IMAGE_TAG=$(echo "${AGENT_VERSION}" | tr + -)
                TAGS="${GIT_SHA} ${AGENT_IMAGE_TAG}"
                ;;
            tag)
                # The version part of the tag
                export AGENT_VERSION=$(echo "${{ github.ref_name }}" | cut -f 2 -d /)
                export AGENT_IMAGE_TAG="${AGENT_VERSION}"
                TAGS="${GIT_SHA} ${AGENT_VERSION} latest"
                ;;
            *)
                echo "Unknown type ${{ github.ref_type }}"
                exit 1
                ;;
          esac
          
          echo "agent-version=${AGENT_VERSION}" >> $GITHUB_OUTPUT
          echo "agent-image-tag=${AGENT_IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "📦 Agent Version: ${AGENT_VERSION}"
          echo "🏷️  Image Tag: ${AGENT_IMAGE_TAG}"
          echo "🏷️  All Tags: ${TAGS}"
  
  test:
    name: Skyhook Agent Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Run unittests
        run: |
          cd agent
          make test
      - name: Generate Summary
        uses: test-summary/action@v2.6
        if: always()
        with:
          paths: "agent/skyhook-agent/test-results.xml"
          output: test-summary.md
      - name: Display Summary
        if: always()
        run: |
          cat test-summary.md >> $GITHUB_STEP_SUMMARY
  # Build container images on native architecture runners (much faster than QEMU)
  build-agent:
    runs-on: ${{ matrix.runner }}
    needs: [test, compute-metadata, fetch-distroless-versions] # Don't run the build and push if the unit tests fail
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Fetch all tags
        run: git fetch --tags --force
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Build and tag container image for single platform on native hardware
      - name: Build the agent container image (${{ matrix.platform }})
        id: build
        env:
          GIT_SHA: ${{ needs.compute-metadata.outputs.git-sha }}
          AGENT_VERSION: ${{ needs.compute-metadata.outputs.agent-version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          cd agent
          PLATFORM_TAG=$(echo "$PLATFORM" | tr '/' '-')
          
          # Lowercase for Docker compliance
          IMAGE_NAME=$(echo "${{env.IMAGE_NAME}}" | tr '[:upper:]' '[:lower:]')
          REGISTRY=$(echo "${{env.REGISTRY}}" | tr '[:upper:]' '[:lower:]')
          
          # Build platform-specific tags for all target tags
          TAGS=""
          for TAG in ${{ needs.compute-metadata.outputs.tags }}; do
            TAGS="$TAGS -t ${REGISTRY}/${IMAGE_NAME}/agent:${TAG}-${PLATFORM_TAG}"
          done

          if [ "${PUSH_TO_REGISTRY}" = "true" ]; then
            PUSH_OR_LOAD="--push"
          else
            PUSH_OR_LOAD="--load"
            echo "Fork PR build: building image without pushing to registry"
          fi
          
          set -x
          docker buildx build \
            --build-arg GIT_SHA=${GIT_SHA} \
            --build-arg AGENT_VERSION=${AGENT_VERSION} \
            --build-arg PYTHON_VERSION=${{ env.PYTHON_VERSION }} \
            --build-arg DEBIAN_VERSION=${{ env.DEBIAN_VERSION }} \
            --build-arg DISTROLESS_VERSION=${{ needs.fetch-distroless-versions.outputs.distroless-version }} \
            --build-arg DISTROLESS_DIGEST_SUFFIX="@${{ needs.fetch-distroless-versions.outputs.distroless-digest }}" \
            ${PUSH_OR_LOAD} \
            --platform "$PLATFORM" \
            --provenance=false \
            ${TAGS@L} \
            --metadata-file=metadata.json \
            -f ../containers/agent.Dockerfile .
          
          echo "digest=$(cat metadata.json | jq -r .\"containerimage.digest\")" >> $GITHUB_OUTPUT

  # Create multi-platform manifest from individual architecture builds
  create-manifest:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    needs: [compute-metadata, build-agent]
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
      subject-name: ${{ steps.manifest.outputs.subject-name }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      # Create and push multi-platform manifests, then delete platform-specific tags
      - name: Create manifests and cleanup
        id: manifest
        run: |
          # Lowercase for Docker compliance
          IMAGE_NAME=$(echo "${{env.IMAGE_NAME}}" | tr '[:upper:]' '[:lower:]')
          REGISTRY=$(echo "${{env.REGISTRY}}" | tr '[:upper:]' '[:lower:]')
          
          # Create manifest for each tag combining amd64 and arm64 images
          for TAG in ${{ needs.compute-metadata.outputs.tags }}; do
            FULL_TAG="${REGISTRY}/${IMAGE_NAME}/agent:${TAG}"
            echo "📦 Creating manifest for $FULL_TAG"
            docker manifest create $FULL_TAG \
              ${FULL_TAG}-linux-amd64 \
              ${FULL_TAG}-linux-arm64
            docker manifest push $FULL_TAG
            echo "✅ Pushed $FULL_TAG"
          done

          echo "subject-name=${REGISTRY}/${IMAGE_NAME}/agent" >> $GITHUB_OUTPUT
          
          # Note: Platform-specific tags (e.g., v1.0.0-linux-amd64) are left in registry
          # as intermediate artifacts. Users should pull the multi-platform manifest tags.
          # GitHub Container Registry doesn't easily support programmatic tag deletion.
          echo "✅ Multi-platform manifests created successfully"

      - name: Resolve multi-platform manifest digest
        id: digest
        uses: ./.github/actions/resolve-oci-digest
        with:
          image: ${{ steps.manifest.outputs.subject-name }}
          tag: ${{ needs.compute-metadata.outputs.git-sha }}
      
      - name: Sign GHCR agent image and attach SBOM
        if: env.PUSH_TO_REGISTRY == 'true' && startsWith(github.ref, 'refs/tags/agent/')
        uses: ./.github/actions/cosign-sign-sbom
        with:
          subject-name: ${{ steps.manifest.outputs.subject-name }}
          subject-digest: ${{ steps.digest.outputs.digest }}

      - name: Attest GHCR agent provenance
        if: env.PUSH_TO_REGISTRY == 'true' && startsWith(github.ref, 'refs/tags/agent/')
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-name: ${{ steps.manifest.outputs.subject-name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

      - name: Verify GHCR agent signature and attestations
        if: env.PUSH_TO_REGISTRY == 'true' && startsWith(github.ref, 'refs/tags/agent/')
        uses: ./.github/actions/cosign-verify-release
        with:
          subject-name: ${{ steps.manifest.outputs.subject-name }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          certificate-identity-regexp: ^https://github.com/${{ github.repository }}/\.github/workflows/agent-ci\.yaml@refs/tags/agent/.*$

  operator-agent-tests:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Operator Agent Integration Tests
    runs-on: ubuntu-latest
    needs: [compute-metadata, create-manifest]
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-tags: true
          fetch-depth: 0
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: operator/go.sum
      
      - name: Log in to the Container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load Kubernetes test versions
        id: k8s-versions
        run: |
          cd operator
          make yq
          YQ="$PWD/bin/yq" ./versions.sh --print >> "$GITHUB_OUTPUT"

      - name: Validate KinD node image
        env:
          K8S_VERSION: ${{ steps.k8s-versions.outputs.kind-nodeimage }}
        run: |
          cd operator
          make validate-kind-node-image KIND_NODE_IMAGE_VERSION="$K8S_VERSION"
      
      - name: Create Kubernetes KinD Cluster
        uses: helm/kind-action@v1.15.0
        with:
          version: ${{ steps.k8s-versions.outputs.kind-binary }}
          node_image: kindest/node:v${{ steps.k8s-versions.outputs.kind-nodeimage }}
          config: operator/config/local-dev/kind-config.yaml
          cluster_name: kind
      
      - name: Restore cached Binaries
        id: cached-binaries
        uses: actions/cache/restore@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-bin-${{ hashFiles('operator/go.mod', 'operator/deps.mk', 'operator/versions.yaml', 'operator/versions.sh') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-bin-
          path: |
            ${{ github.workspace }}/operator/bin
            ~/.cache/go-build
      
      - name: Install dependencies
        if: steps.cached-binaries.outputs.cache-hit != 'true'
        run: |
          cd operator
          make install-deps
      
      - name: Save cached Binaries
        if: steps.cached-binaries.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ runner.os }}-${{ runner.arch }}-bin-${{ hashFiles('operator/go.mod', 'operator/deps.mk', 'operator/versions.yaml', 'operator/versions.sh') }}
          path: |
            ${{ github.workspace }}/operator/bin
            ~/.cache/go-build
      
      - name: Run operator-agent tests
        env:
          AGENT_IMAGE: ${{ format('{0}/{1}/agent:{2}', env.REGISTRY, github.repository, needs.compute-metadata.outputs.agent-image-tag) }}
        run: |
          cd operator
          export AGENT_IMAGE="${AGENT_IMAGE,,}"
          echo "Testing with agent image: ${AGENT_IMAGE}"
          make build-cli
          make setup-kind-cluster operator-agent-tests

      - name: Dump diagnostics on failure
        if: failure()
        uses: ./.github/actions/dump-operator-agent-diagnostics

  # See operator-ci.yaml's ci-gate for rationale. operator-ci, agent-ci,
  # and lint-ci all publish a check named `ci-gate` — GitHub composes
  # same-named required checks, so every ci-gate that posts must pass.
  # lint-ci has no path filter so a ci-gate always appears on every PR.
  # needs: only includes jobs that ALWAYS run. create-manifest and
  # operator-agent-tests skip on fork PRs (need GHCR write secrets) —
  # including either would make the gate fail red on legitimate skips.
  ci-gate:
    name: ci-gate
    needs: [test, build-agent]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required jobs passed
        run: |
          results='${{ toJSON(needs) }}'
          echo "$results"
          echo "$results" | jq -e 'to_entries | all(.value.result == "success")'
