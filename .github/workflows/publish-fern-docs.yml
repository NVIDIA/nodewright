# Publishes the Fern documentation site on a chart release or manual dispatch.
#
# The docs version axis follows the Helm chart. This repo releases four
# components independently (operator, agent, chart, cli) and every one of them
# publishes a GitHub Release, so an unfiltered `release` trigger would fire up
# to four times per coordinated release and label the docs with whichever
# component won the race. The chart is what users install and it ships on every
# rollout, so its version is the one meaningful label for a docs snapshot.
# Releases of the other three components are skipped, not failed.
#
# Tags are `chart/vX.Y.Z`. git is asked for the full tag; the stripped `vX.Y.Z`
# names version files, slugs and display names. The resolve step emits both as
# separate outputs — do not use one where the other is meant.
#
# All versions serve frozen content extracted from their git tag — there is no
# "live docs" entry, so a docs change merged to main is not published until the
# next chart release carries it. The newest version is stamped "Latest · vX.Y.Z"
# at publish time so readers know which is current; the stamp is transient and
# not persisted.
#
# Manual dispatch accepts an optional `tag` input:
#   - empty: resolves to the newest chart/vX.Y.Z tag in the repository
#   - explicit: `chart/v1.2.0` or the bare `v1.2.0` — both resolve the same
#
# On a stable chart/vX.Y.Z release (publish or dispatch), the workflow also:
#   1. Generates fern/versions/vX.Y.Z.yml from the tag's docs/index.yml
#   2. Adds a version entry to fern/docs.yml, sorted by semver descending
#   3. Prunes older versions to keep only the MAX_VERSIONS most recent
#   4. Opens a PR to persist registry changes back to main (after publish)
#
# Pre-releases (chart/vX.Y.Z-rc.N) publish but skip version registration.
#
# Required configuration:
# - Organization secret: DOCS_FERN_TOKEN (from `fern token` for the nvidia Fern org)

name: Publish Fern Docs

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Chart tag to publish (e.g. chart/v1.2.0, or the bare v1.2.0). Leave empty to use the newest chart tag."
        required: false
        type: string
  ## --- OPTION: tag-push trigger ---
  ## Use this instead of `release` for repos that push tags without creating
  ## GitHub Releases. The resolve step handles both triggers, but the release
  ## trigger is preferred because the Release object always exists at workflow
  ## start — no race between tag push and Release creation.
  # push:
  #   tags:
  #     - "chart/v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fern-publish
  cancel-in-progress: true

env:
  YQ_VERSION: v4.53.2
  MAX_VERSIONS: 3

jobs:
  publish:
    # `on: release` has no tag filter, so the component gate lives here. The
    # operator, agent and cli releases fire this workflow too; they are not
    # docs-publishing events, so skip them rather than failing the run.
    if: >-
      github.event_name != 'release' ||
      startsWith(github.event.release.tag_name, 'chart/v')
    runs-on: ubuntu-latest
    # runs-on: linux-amd64-cpu8  # NVIDIA self-hosted runner
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-tags: true
          persist-credentials: false

      - name: Install yq
        run: |
          if command -v yq &>/dev/null; then
            echo "yq already installed: $(yq --version)"
          else
            OS=$(uname -s | tr '[:upper:]' '[:lower:]')
            ARCH=$(uname -m)
            case "$ARCH" in
              x86_64)  ARCH="amd64" ;;
              aarch64) ARCH="arm64" ;;
            esac
            mkdir -p "$HOME/.local/bin"
            curl -sSfL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_${OS}_${ARCH}" -o "$HOME/.local/bin/yq"
            chmod +x "$HOME/.local/bin/yq"
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          fi

      - name: Resolve target tag
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -eo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "release" ]; then
            TAG="${RELEASE_TAG}"
            IS_PRERELEASE="${RELEASE_PRERELEASE}"
          elif [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            # Scoped to chart tags on purpose: the newest release in this repo
            # is often an operator or cli release, which is not publishable here.
            # Chart tags cut before Fern navigation landed are skipped — see the
            # docs/index.yml check below for why they cannot be published.
            for CANDIDATE in $(git tag -l 'chart/v*' --sort=-v:refname \
              | grep -E '^chart/v[0-9]+\.[0-9]+\.[0-9]+$'); do
              if git cat-file -e "refs/tags/${CANDIDATE}:docs/index.yml" 2>/dev/null; then
                TAG="${CANDIDATE}"
                break
              fi
            done
            if [ -z "${TAG:-}" ]; then
              echo "::error::No chart tag carries docs/index.yml yet — the first publishable release is the first chart tag cut after this workflow landed"
              exit 1
            fi
          fi
          # A bare version is accepted on manual dispatch: the docs version axis
          # follows the chart, so v1.2.0 and chart/v1.2.0 name the same release.
          # Only a bare version is promoted; anything else keeps the name the
          # caller gave it so the error below names what they actually typed.
          case "$TAG" in
            v*) TAG="chart/${TAG}" ;;
          esac
          if ! [[ "$TAG" =~ ^chart/v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Tag '${TAG}' is not a publishable chart tag (expected chart/vMAJOR.MINOR.PATCH[-rc.N])"
            exit 1
          fi
          if ! git show-ref --verify --quiet "refs/tags/${TAG}"; then
            echo "::error::Tag '${TAG}' does not exist in this repository"
            exit 1
          fi
          # Chart tags predating the Fern scaffold have no docs/index.yml to freeze.
          # Without this the run dies later inside `git archive` with a bare
          # "pathspec did not match any files", which reads as a workflow bug.
          if ! git cat-file -e "refs/tags/${TAG}:docs/index.yml" 2>/dev/null; then
            echo "::error::Tag '${TAG}' has no docs/index.yml — it predates the Fern docs navigation and cannot be published"
            exit 1
          fi
          # The docs version axis drops the component prefix: chart/v1.2.0 -> v1.2.0.
          VERSION="${TAG#chart/}"
          # Pre-release detection: use the Release event flag when available,
          # fall back to hyphen check for tag-push and dispatch triggers.
          if [ "${IS_PRERELEASE}" = "true" ] || [[ "$VERSION" == *-* ]]; then
            IS_RELEASE=false
          else
            IS_RELEASE=true
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "is_release=$IS_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Resolved target tag: $TAG (version=$VERSION, is_release=$IS_RELEASE)"

      - name: Register new version from tag
        if: steps.resolve.outputs.is_release == 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          TAG_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -eo pipefail

          if [ -f "fern/versions/${TAG_VERSION}.yml" ]; then
            echo "Version ${TAG_VERSION} already registered — skipping"
            exit 0
          fi

          mkdir -p fern/versions
          echo "Generating fern/versions/${TAG_VERSION}.yml from tag $TAG"
          git archive "refs/tags/${TAG}" -- docs/index.yml | tar -xO docs/index.yml | \
            sed "s|path: |path: ${TAG_VERSION}-content/|g" > "fern/versions/${TAG_VERSION}.yml"

          export TAG_VERSION
          EXPR='.products[0].versions += [{"display-name": env(TAG_VERSION),'
          EXPR+=' "path": "versions/" + env(TAG_VERSION) + ".yml",'
          EXPR+=' "slug": env(TAG_VERSION), "availability": "stable"}]'
          yq -i "$EXPR" fern/docs.yml

          # Sort all version entries by semver descending
          SORTED_SLUGS=$(yq '.products[0].versions[].slug' fern/docs.yml | sort -rV)
          yq -i '.products[0].versions = []' fern/docs.yml
          for slug in $SORTED_SLUGS; do
            export slug
            yq -i '.products[0].versions += [{"display-name": env(slug), "path": "versions/" + env(slug) + ".yml", "slug": env(slug), "availability": "stable"}]' fern/docs.yml
          done

          echo "--- docs.yml versions after insert + sort ---"
          yq '.products[0].versions[].display-name' fern/docs.yml

      - name: Prune old versions
        if: steps.resolve.outputs.is_release == 'true'
        run: |
          set -eo pipefail
          TOTAL=$(yq '.products[0].versions | length' fern/docs.yml)

          if [ "$TOTAL" -le "$MAX_VERSIONS" ]; then
            echo "Only $TOTAL versions — nothing to prune (keeping $MAX_VERSIONS)"
            exit 0
          fi

          PRUNED=$(yq ".products[0].versions[$MAX_VERSIONS:][].slug" fern/docs.yml)
          yq -i ".products[0].versions |= .[:$MAX_VERSIONS]" fern/docs.yml

          for slug in $PRUNED; do
            rm -f "fern/versions/${slug}.yml"
            echo "Pruned $slug"
          done

          echo "--- docs.yml versions after prune ---"
          yq '.products[0].versions[].display-name' fern/docs.yml

      - name: Checkout frozen version content
        run: ./scripts/hydrate-fern-versions.sh

      - name: Stamp newest version as Latest
        run: |
          cp fern/docs.yml /tmp/docs.yml.preStamp
          NEWEST=$(yq '.products[0].versions[0].display-name' fern/docs.yml)
          if [ -n "$NEWEST" ] && [ "$NEWEST" != "null" ]; then
            export NEWEST
            yq -i '.products[0].versions[0].display-name = "Latest · " + env(NEWEST)' fern/docs.yml
          fi
          echo "--- docs.yml versions after stamp ---"
          yq '.products[0].versions[].display-name' fern/docs.yml

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Fern CLI
        run: npm install -g fern-api@$(jq -r .version fern/fern.config.json)

      - name: Publish docs
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        working-directory: ./fern
        run: |
          set -eo pipefail
          fern generate --docs 2>&1 | tee /tmp/fern-output.log
          URL=$(grep -oP 'Published docs to \K.*(?= \()' /tmp/fern-output.log || true)
          if [ -n "$URL" ]; then
            echo "### Published: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Restore unstamped docs.yml for persistence
        if: steps.resolve.outputs.is_release == 'true'
        run: cp /tmp/docs.yml.preStamp fern/docs.yml

      - name: Open PR for version registry changes
        if: steps.resolve.outputs.is_release == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          base: main
          branch: chore/fern-register-${{ steps.resolve.outputs.version }}
          delete-branch: true
          sign-commits: true
          commit-message: "chore(fern): register ${{ steps.resolve.outputs.version }}, keep latest ${{ env.MAX_VERSIONS }} versions [automated]"
          title: "chore(fern): register ${{ steps.resolve.outputs.version }}"
          body: |
            Automated registration of `${{ steps.resolve.outputs.tag }}` in the Fern docs versions registry.

            Generated by the `Publish Fern Docs` workflow.
          add-paths: |
            :(glob)fern/versions/v*.yml
            fern/docs.yml
