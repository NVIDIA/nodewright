# Builds and tests the `tools` module: the OpenVEX projection tool used by the
# release evidence path, and the release-policy tests that pin it, including the
# tests that drive scripts/install-cli.sh against a fake registry.
#
# The path filter (the push paths below, and the `tools` filter in
# merge-gate.yaml, which runs this for pull requests) deliberately covers
# `.github/**` and `.openvex.json` as well as `tools/**`. That looks too broad
# for a Go module's CI and is not: the
# release-policy tests under tools/tests/releasepolicy assert properties OF the
# workflows and composite actions (that SBOM and VEX attestations target a
# platform manifest and never the index, that every cosign attest pins the
# bundle format, that the two cosign version pins agree). Filtering on `tools/**`
# alone would mean a workflow edit that violates the policy never runs the test
# written to catch it, which is the one failure that would make these tests
# decorative.

name: Tools CI

on:
  workflow_call: {}
  push:
    branches:
      - main
    paths:
      - tools/**
      - .github/workflows/**
      - .github/actions/**
      - .openvex.json
      - scripts/install-cli.sh

permissions:
  contents: read

# A literal prefix rather than github.workflow: when merge-gate.yaml calls this
# workflow, github.workflow is the caller's name, so a concurrency group the
# caller ever declared in the usual `${{ github.workflow }}-${{ github.ref }}`
# form would be this same group, and the call would cancel its own caller.
concurrency:
  group: tools-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt all JS actions into Node 24 ahead of GitHub's Node 20 phase-out.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    name: Tools Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/go.mod
          # `tools` itself has no third-party dependencies and no go.sum, which
          # is what lets the release job run `go run ./cmd/openvex` with only a
          # toolchain. The nested `tools/tests` module is the one thing here
          # that pulls anything (a YAML parser, for the release-policy tests),
          # so the cache is keyed on its go.sum rather than on the module named
          # by go-version-file. Pointing setup-go at tools/go.mod for the cache
          # would give it nothing to key on and fail the step.
          cache-dependency-path: tools/tests/go.sum

      # `make test` runs fmt-check, vet and the unit tests. The targets live in
      # tools/Makefile rather than being spelled out here, matching how
      # agent-ci.yaml calls `make test` for its module.
      #
      # The release-policy tests execute the real platform-resolution script,
      # which uses an associative array and so needs bash 4 or newer. The
      # ubuntu-latest image provides it; the tests skip loudly rather than
      # passing silently if a future runner image does not.
      - name: Test
        working-directory: tools
        run: make test
