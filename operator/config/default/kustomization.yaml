# Adds namespace to all resources.
namespace: nodewright-operator-system

# Value of this field is prepended to the
# names of all resources, e.g. a deployment named
# "wordpress" becomes "alices-wordpress".
# Kept in sync with the Helm chart, where the same names come from
# `chart.fullname` and render `nodewright-*` by default (#440).
namePrefix: nodewright-

# Labels to add to all resources and selectors.
#labels:
#- includeSelectors: true
#  pairs:
#    someName: someValue

resources:
- ../crd
- ../rbac
- ../manager
# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
# crd/kustomization.yaml
- ../webhook
# [PROMETHEUS] To enable prometheus monitor, uncomment all sections with 'PROMETHEUS'.
#- ../prometheus
- limitrange.yaml

patches:
# Protect the /metrics endpoint by putting it behind auth.
# If you want your controller-manager to expose the /metrics
# endpoint w/o any authn/z, please comment the following line.
- path: manager_metrics_patch.yaml

# [WEBHOOK] To enable webhook, uncomment all the sections with [WEBHOOK] prefix including the one in
# crd/kustomization.yaml
- path: manager_webhook_patch.yaml

# Copies the manager's WEBHOOK_SECRET_NAME into the Role's Secret rule, so the Secret's
# name is set in one place (manager_webhook_patch.yaml). The target is the entry naming
# the default Secret, which role.yaml always has (it is generated from the kubebuilder
# marker). Replacements run before an overlay's patches: an overlay that patches
# WEBHOOK_SECRET_NAME has to repeat this replacement.
replacements:
- source:
    kind: Deployment
    name: controller-manager
    fieldPath: spec.template.spec.containers.[name=manager].env.[name=WEBHOOK_SECRET_NAME].value
  targets:
  - select:
      kind: Role
      name: manager-role
    fieldPaths:
    - rules.*.resourceNames.[=webhook-cert]
