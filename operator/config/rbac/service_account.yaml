apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: serviceaccount
    app.kubernetes.io/instance: controller-manager-sa
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: nodewright
    app.kubernetes.io/part-of: nodewright
    app.kubernetes.io/managed-by: kustomize
  name: controller-manager
  namespace: system
---
# Package pods (stage, interrupt and preflight Jobs) run as this ServiceAccount; the operator
# is told its name through PACKAGE_SERVICE_ACCOUNT in config/manager/manager.yaml. It is bound
# to no Role and mounts no token, because package pods never call the API server.
# For a private registry, add imagePullSecrets to both ServiceAccounts in this file, as the
# chart's imagePullSecrets value does.
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app.kubernetes.io/name: serviceaccount
    app.kubernetes.io/instance: package-sa
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: nodewright
    app.kubernetes.io/part-of: nodewright
    app.kubernetes.io/managed-by: kustomize
  name: package
  namespace: system
automountServiceAccountToken: false
