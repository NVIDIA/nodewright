apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chart.fullname" . }}-controller-manager
  namespace: "{{ .Release.Namespace }}"
  annotations:
    checkov.io/skip1: CKV_K8S_43=Image digest not required - we use tags
  labels:
    app: {{ include "chart.fullname" . }}-controller-manager
    app.kubernetes.io/component: manager
    app.kubernetes.io/created-by: {{ include "chart.name" . }}
    app.kubernetes.io/part-of: {{ include "chart.name" . }}
    control-plane: controller-manager
  {{- include "chart.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controllerManager.replicas }}
  selector:
    # Deployment.spec.selector is immutable. These labels are sourced from the
    # shared chart.managerSelectorLabels helper so the selector-migration
    # pre-upgrade hook compares against the exact same set; if the chart name or
    # release name ever changes the selector, that hook deletes the stale
    # Deployment so `helm upgrade` can recreate it.
    matchLabels:
      {{- include "chart.managerSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app: {{ include "chart.fullname" . }}-controller-manager
      {{- /* Sourced from the same helper as spec.selector above so the pod
             labels always stay a superset of the immutable selector; if they
             were built separately they could drift and the Deployment would
             stop matching its own pods. */}}
      {{- include "chart.managerSelectorLabels" . | nindent 8 }}
      annotations:
        kubectl.kubernetes.io/default-container: manager
    spec:
      
      automountServiceAccountToken: false
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
                - arm64
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
              {{- range .Values.controllerManager.nodeAffinity.matchExpressions }}
              - key: {{ .key }}
                operator: {{ .operator }}
                {{- if .values }}
                values:
                {{- range .values }}
                - {{ . }}
                {{- end }}
                {{- end }}
              {{- end }}
        {{- /* Selector is written out here rather than taken from values because it has to
               match the release-templated pod label; a user-supplied selector in values.yaml
               could not name it. Matches the PodDisruptionBudget selector below, so the two
               always describe the same set of pods. Preferred rather than required: a hard
               constraint leaves replicas Pending wherever there are fewer schedulable nodes
               than replicas, including the single-node kind clusters e2e runs on. */}}
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app: {{ include "chart.fullname" . }}-controller-manager
      {{- with .Values.controllerManager.tolerations }}
      tolerations: 
        {{- toYaml . | nindent 6 }}
      {{- end }}
      {{- with .Values.controllerManager.selectors }}
      nodeSelector: 
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.useHostNetwork }}
      hostNetwork: true
      {{- end }}
      containers:
      - command:
        - /manager
        env:
        - name: METRICS_PORT
          value: {{ quote .Values.controllerManager.manager.env.metricsPort }}
        - name: PROBE_PORT
          value: {{ quote .Values.controllerManager.manager.env.probePort }}
        - name: LEADER_ELECTION
          value: {{ quote .Values.controllerManager.manager.env.leaderElection }}
        - name: LOG_LEVEL
          value: {{ quote .Values.controllerManager.manager.env.logLevel }}
        - name: ENABLE_WEBHOOKS
          value: {{ quote .Values.webhook.enable }}
        {{- /* The operator mints its own webhook serving cert, so it has to be told the
               Service name the chart rendered: that name goes in the cert SAN, and if it
               does not match the Service the API server dials, admission fails closed.
               The webhook configurations themselves are found by label, not by name. */}}
        - name: WEBHOOK_SECRET_NAME
          value: {{ quote (.Values.webhook.secretName | default "webhook-cert") }}
        - name: WEBHOOK_SERVICE_NAME
          value: {{ quote (include "chart.webhookServiceName" .) }}
        - name: NAMESPACE
          value: {{ .Release.Namespace }}
        - name: IMAGE_PULL_SECRET
          value: {{ quote .Values.imagePullSecret }}
        - name: COPY_DIR_ROOT
          value: {{ quote .Values.controllerManager.manager.env.copyDirRoot }}
        - name: REAPPLY_ON_REBOOT
          value: {{ quote .Values.controllerManager.manager.env.reapplyOnReboot }}
        - name: LEGACY_CLEANUP_DELAY
          value: {{ quote .Values.controllerManager.manager.env.legacyCleanupDelay }}
        - name: JOB_TTL_SUCCEEDED
          value: {{ quote .Values.controllerManager.manager.env.jobTtlSucceeded }}
        - name: JOB_TTL_FAILED
          value: {{ quote .Values.controllerManager.manager.env.jobTtlFailed }}
        - name: JOB_STAGE_TIMEOUT
          value: {{ quote .Values.controllerManager.manager.env.jobStageTimeout }}
        - name: JOB_BACKOFF_LIMIT
          value: {{ quote .Values.controllerManager.manager.env.jobBackoffLimit }}
        - name: PUBLISH_LEGACY_METRICS
          value: {{ quote .Values.controllerManager.manager.env.publishLegacyMetrics }}
        - name: RUNTIME_REQUIRED_TAINT
          value: {{ quote .Values.controllerManager.manager.env.runtimeRequiredTaint }}
        - name: PAUSE_IMAGE
          value: {{ quote .Values.controllerManager.manager.env.pauseImage }}
        - name: AGENT_IMAGE
          value: {{ .Values.controllerManager.manager.agent.repository }}{{- if and (.Values.controllerManager.manager.agent.tag) (.Values.controllerManager.manager.agent.digest) }}:{{ .Values.controllerManager.manager.agent.tag }}@{{ .Values.controllerManager.manager.agent.digest }}{{- else if .Values.controllerManager.manager.agent.digest }}@{{ .Values.controllerManager.manager.agent.digest }}{{- else }}:{{ .Values.controllerManager.manager.agent.tag }}{{- end }}
        - name: KUBERNETES_CLUSTER_DOMAIN
          value: {{ quote .Values.kubernetesClusterDomain }}
        image: {{ .Values.controllerManager.manager.image.repository }}{{- if .Values.controllerManager.manager.image.digest }}{{- if .Values.controllerManager.manager.image.tag }}:{{ .Values.controllerManager.manager.image.tag }}@{{ .Values.controllerManager.manager.image.digest }}{{- else }}@{{ .Values.controllerManager.manager.image.digest }}{{- end }}{{- else }}:{{ .Values.controllerManager.manager.image.tag | default .Chart.AppVersion }}{{- end }}
        imagePullPolicy: Always
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 8443
          name: https
          protocol: TCP
        - containerPort: 9443
          name: webhook-server
          protocol: TCP
        volumeMounts:
        - mountPath: /var/run/secrets/kubernetes.io/serviceaccount
          name: kube-api-access
          readOnly: true
        {{- if .Values.webhook.enable }}
        - mountPath: /tmp
          name: webhook-certs
        {{- end }}
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 20
          successThreshold: 1
          failureThreshold: 2
          timeoutSeconds: 3
        resources: {{ if .Values.controllerManager.manager.resources }}{{- toYaml .Values.controllerManager.manager.resources | nindent 10 }}{{ else }}
          limits:
            cpu: {{ maxf 1000 (mulf 1.6 .Values.estimatedNodeCount (maxf 1 (mulf 0.4 .Values.estimatedPackageCount))) | int }}m
            memory: {{ maxf 512 (mulf 0.8 .Values.estimatedNodeCount (maxf 1 (mulf 0.4 .Values.estimatedPackageCount))) | int }}Mi
          requests:
            cpu: {{ maxf 500 (mulf 0.5 (mulf 1.6 .Values.estimatedNodeCount (maxf 1 (mulf 0.4 .Values.estimatedPackageCount)))) | int }}m
            memory: {{ maxf 256 (mulf 0.4 .Values.estimatedNodeCount) | int }}Mi
          {{- end }}
        securityContext: {{- toYaml .Values.controllerManager.manager.containerSecurityContext
          | nindent 10 }}
      imagePullSecrets:
      {{- if .Values.imagePullSecret }}
        - name: {{ quote .Values.imagePullSecret }}
      {{- end }}
      volumes:
      - name: kube-api-access
        projected:
          defaultMode: 420
          sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3607
          - configMap:
              items:
              - key: ca.crt
                path: ca.crt
              name: kube-root-ca.crt
          - downwardAPI:
              items:
              - fieldRef:
                  apiVersion: v1
                  fieldPath: metadata.namespace
                path: namespace
      {{- if .Values.webhook.enable }}
      - name: webhook-certs
        emptyDir: {}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: {{ include "chart.fullname" . }}-controller-manager
      terminationGracePeriodSeconds: 10
{{ if ((.Values.controllerManager.podDisruptionBudget).minAvailable) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "chart.fullname" . }}-controller-manager-pdb
spec:
  minAvailable: {{ .Values.controllerManager.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app: {{ include "chart.fullname" . }}-controller-manager
  unhealthyPodEvictionPolicy: AlwaysAllow
{{ end }}
