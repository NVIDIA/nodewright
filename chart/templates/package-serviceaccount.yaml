{{/* ServiceAccount the operator runs package pods (stage, interrupt and preflight
     Jobs) as; its name reaches the operator as PACKAGE_SERVICE_ACCOUNT. It is
     bound to no Role and mounts no token, because package pods never call the
     API server: it exists only to carry imagePullSecrets onto those pods. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "chart.fullname" . }}-package
  namespace: "{{ .Release.Namespace }}"
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: {{ include "chart.name" . }}
    app.kubernetes.io/part-of: {{ include "chart.name" . }}
  {{- include "chart.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
