{{ if ((.Values.rbac).createNodeWrightEditorRole) }}
# permissions for end users to edit NodeWrights and DeploymentPolicies.
## NOTE: not managed by helmify, needs to be manually updated, however, should not change much
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/component: rbac
    app.kubernetes.io/created-by: {{ include "chart.name" . }}
    app.kubernetes.io/part-of: {{ include "chart.name" . }}
  {{- include "chart.labels" . | nindent 4 }}
  name: nodewright-editor-role
rules:
- apiGroups:
  - nodewright.nvidia.com
  resources:
  - nodewrights
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nodewright.nvidia.com
  resources:
  - nodewrights/status
  verbs:
  - get
- apiGroups:
  - nodewright.nvidia.com
  resources:
  - deploymentpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
{{ end }}
